<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>麦地缓存</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>

    <!-- ===== 共享 Logo 标记（连接/主界面弹窗共用，跟随主题色） ===== -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
        <symbol id="md-logo-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="titlebar-logo-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="var(--accent-hover)" />
                    <stop offset="100%" stop-color="var(--accent)" />
                </linearGradient>
            </defs>
            <ellipse cx="44" cy="26" rx="24" ry="9" fill="url(#titlebar-logo-gradient)" />
            <path d="M20 26 L20 70 Q20 78 44 78 Q68 78 68 70 L68 26" fill="url(#titlebar-logo-gradient)" />
            <path d="M20 42 Q44 50 68 42" stroke="rgba(255,255,255,0.35)" stroke-width="3" fill="none" stroke-linecap="round" />
            <path d="M20 60 Q44 68 68 60" stroke="rgba(255,255,255,0.35)" stroke-width="3" fill="none" stroke-linecap="round" />
            <circle cx="72" cy="72" r="18" fill="var(--bg-secondary)" stroke="var(--accent)" stroke-width="3" />
            <text x="72" y="77" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" font-size="13" fill="var(--accent)">MR</text>
            <circle cx="86" cy="56" r="5" fill="var(--accent)" />
            <circle cx="56" cy="86" r="5" fill="var(--accent)" />
            <path d="M68 56 L78 60" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" fill="none" />
            <path d="M64 68 L58 86" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" fill="none" />
        </symbol>
    </svg>

    <!-- ===== 主窗口 ===== -->
    <div class="app-window">

        <!-- ===== 标题栏 ===== -->
        <header class="titlebar">
            <button title="折叠/展开连接列表" id="btnSidebarToggle" class="sidebar-toggle"><i class="fas fa-bars" id="sidebarToggleIcon"></i></button>
            <div class="logo">
                <svg class="logo-mark" aria-label="麦地缓存 Logo"><use href="#md-logo-mark" /></svg>
                麦地缓存
                <span id="appVersion">v-</span>
            </div>
            <div class="connection-status">
                <span class="dot" id="statusDot"></span>
                <span id="statusLabel">已连接 · localhost:6379</span>
            </div>
            <div class="spacer"></div>
            <div class="theme-dropdown">
                <button title="切换主题" id="btnTheme" class="ghost-btn"><i class="fas fa-palette"></i></button>
                <div class="theme-menu" id="themeMenu">
                    <div class="theme-menu-title">选择主题</div>
                    <div class="theme-option active" data-theme-value="spring"><span class="theme-swatch" style="background:#4caf50"></span>春分</div>
                    <div class="theme-option" data-theme-value="summer"><span class="theme-swatch" style="background:#22a6f2"></span>立夏</div>
                    <div class="theme-option" data-theme-value="golden"><span class="theme-swatch" style="background:#d99a1b"></span>初秋</div>
                    <div class="theme-option" data-theme-value="autumn"><span class="theme-swatch" style="background:#f5b342"></span>深秋</div>
                    <div class="theme-option" data-theme-value="winter"><span class="theme-swatch" style="background:#f5f6fa"></span>冬至</div>
                </div>
            </div>
            <div class="actions">
                <button title="检查更新" id="btnCheckUpdate"><i class="fas fa-cloud-arrow-down"></i><span class="update-dot" id="updateDot"></span></button>
                <button title="刷新所有Key" id="btnRefresh"><i class="fas fa-sync-alt"></i></button>
                <button title="清空当前数据库" id="btnFlush"><i class="fas fa-trash-alt"></i></button>
                <button class="primary" id="btnNewConnection"><i class="fas fa-plus"></i> 新建连接</button>
            </div>
        </header>

        <!-- ===== 主体 ===== -->
        <div class="app-body">

            <!-- ===== 左侧边栏 ===== -->
            <aside class="sidebar" id="sidebar">
                <div class="section-title"><i class="fas fa-plug" style="margin-right:6px;"></i> 连接</div>
                <div class="connection-list" id="connectionList">
                    <!-- 由 JS 动态渲染 -->
                </div>
                <button class="add-connection" id="addConnectionBtn">
                    <i class="fas fa-plus-circle"></i> 添加连接
                </button>
                <div class="conn-io-actions">
                    <button id="btnImportConnections" title="从 JSON 文件导入连接配置（同 id 会被覆盖）"><i class="fas fa-file-import"></i> 导入</button>
                    <button id="btnExportConnections" title="把连接配置导出为 JSON 文件，可在另一台机器导入"><i class="fas fa-file-export"></i> 导出</button>
                </div>

                <div class="sidebar-footer">
                    <div class="server-stats">
                        <div class="stat-item" id="statDiskItem" title="Redis 持久化数据所在磁盘"><span>磁盘</span><span class="val" id="statDisk">-</span></div>
                        <div class="stat-item"><span>内存</span><span class="val" id="statMem">-</span></div>
                        <div class="stat-item"><span>连接数</span><span class="val" id="statConn">-</span></div>
                        <div class="stat-item"><span>Key 总数</span><span class="val" id="statKeys">-</span></div>
                    </div>
                </div>
            </aside>
            <div class="splitter splitter-v" id="splitterSidebar"></div>

            <!-- ===== 主内容 ===== -->
            <main class="main-content">

                <!-- 工具栏 -->
                <div class="toolbar">
                    <div class="key-db-selector" id="dbSelectorWrap" title="选择数据库 (Db)">
                        <i class="fas fa-database"></i>
                        <select id="dbSelect" disabled>
                            <option value="0">Db0</option>
                        </select>
                    </div>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="搜索 Key ... (支持 * 通配符)" id="keySearch" />
                        <button class="sep-btn" id="btnSeparator" title="设置 Key 分隔符（文件夹折叠模式使用）"><i class="fas fa-slash"></i><span id="sepLabel">:</span></button>
                    </div>
                    <div class="toolbar-actions">
                        <button id="btnAddKey"><i class="fas fa-plus"></i> 新增 Key</button>
                        <button id="btnImport"><i class="fas fa-file-import"></i> 导入</button>
                        <button id="btnExport"><i class="fas fa-file-export"></i> 导出</button>
                    </div>
                </div>

                <!-- 数据面板 -->
                <div class="data-panel">
                    <!-- Key 树 -->
                    <div class="key-tree" id="keyTree">
                        <!-- 由 JS 动态渲染 -->
                    </div>
                    <div class="splitter splitter-v" id="splitterTree"></div>

                    <!-- Key 详情 -->
                    <div class="key-detail" id="keyDetail">
                        <!-- 由 JS 动态渲染 -->
                    </div>
                </div>

            </main>

        </div>
        <div class="splitter splitter-h" id="splitterTerminal"></div>

        <!-- ===== 底部面板：终端 / 实时监控（共用同一块可拖拽、可折叠的区域） ===== -->
        <div class="terminal-panel" id="terminalPanel">
            <div class="terminal-header" id="terminalToggle">
                <div class="term-tabs">
                    <button class="term-tab active" id="tabTerminal" title="内置终端"><i class="fas fa-terminal"></i> 终端</button>
                    <button class="term-tab" id="tabMonitor" title="实时显示服务器上执行的命令（MONITOR）"><i class="fas fa-satellite-dish"></i> 实时监控</button>
                </div>
                <div class="spacer"></div>
                <div class="term-actions">
                    <button id="termClear" title="清空终端"><i class="fas fa-eraser"></i></button>
                    <button id="monitorClear" class="monitor-only" title="清空监控输出"><i class="fas fa-eraser"></i></button>
                    <button id="termToggleBtn" title="折叠/展开"><i class="fas fa-chevron-down" id="termChevron"></i></button>
                </div>
            </div>
            <div class="terminal-body" id="terminalBody">
                <div class="line"><span class="prompt">></span><span class="output ok">Redis 终端已就绪</span></div>
                <div class="line"><span class="prompt">></span><span class="output">输入命令并按 Enter 执行</span></div>
            </div>
            <div class="terminal-input-row">
                <span class="prompt-label">redis&gt;</span>
                <input type="text" id="terminalInput" placeholder="输入 Redis 命令 ..." autofocus />
                <button id="terminalSend">执行</button>
            </div>
            <div class="monitor-view" id="monitorView">
                <div class="monitor-toolbar">
                    <button class="primary" id="monitorToggle" disabled><i class="fas fa-play"></i> 开始监控</button>
                    <span class="monitor-state" id="monitorState"><i class="fas fa-circle-info"></i> 未开始</span>
                    <div class="spacer"></div>
                    <label class="monitor-filter" title="按原文过滤（不区分大小写的包含匹配）">
                        <i class="fas fa-filter"></i>
                        <input type="text" id="monitorFilter" placeholder="过滤 key / 命令 / 客户端 ..." />
                    </label>
                    <label class="monitor-follow" title="新命令到达时自动滚到底部"><input type="checkbox" id="monitorFollow" checked /><span>自动滚动</span></label>
                    <span class="monitor-count" id="monitorCount">0 行</span>
                </div>
                <div class="monitor-body" id="monitorBody">
                    <div class="monitor-empty">
                        点「开始监控」后，这里实时显示服务器上执行的每条命令（<code>MONITOR</code>）。<br />
                        监控用的是独立连接，不影响 Key 列表 / 终端的正常使用；<br />
                        集群模式不支持（MONITOR 是节点级命令），请用「单机」模式直连要观察的节点。
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 更新进度条（后台下载时出现，常驻窗口底部，不挡终端输入） ===== -->
        <div class="update-bar" id="updateBar">
            <div class="update-bar-fill" id="updateBarFill"></div>
            <div class="update-bar-inner">
                <i class="fas fa-circle-notch" id="updateBarIcon"></i>
                <span id="updateBarText">正在后台下载更新…</span>
                <span class="update-bar-pct" id="updateBarPct"></span>
                <div class="update-bar-spacer"></div>
                <button class="primary" id="updateBarRestart" style="display:none;">立即重启</button>
                <button id="updateBarDismiss" title="收起进度条（更新已下载，重启后生效）" style="display:none;"><i class="fas fa-times"></i></button>
            </div>
        </div>

    </div>

    <!-- ===== 连接对话框 ===== -->
    <div class="modal-overlay" id="connectionModal">
        <div class="modal">
            <div class="modal-title"><svg class="logo-mark" aria-label="麦地连接 Logo"><use href="#md-logo-mark" /></svg> <span id="modalTitle">新建连接</span></div>
            <div class="form-group">
                <label>连接名称</label>
                <input type="text" id="connName" placeholder="例如: 本地开发" value="localhost" />
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>主机</label>
                    <input type="text" id="connHost" placeholder="127.0.0.1" value="127.0.0.1" />
                </div>
                <div class="form-group">
                    <label>端口</label>
                    <input type="number" id="connPort" placeholder="6379" value="6379" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>用户名 (可选)</label>
                    <input type="text" id="connUser" placeholder="default" />
                </div>
                <div class="form-group">
                    <label>密码 (可选)</label>
                    <input type="password" id="connPass" placeholder="••••••••" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="checkbox-label"><input type="checkbox" id="connReadonly" /><span>只读连接</span></label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label"><input type="checkbox" id="connCluster" /><span>集群模式</span></label>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="checkbox-label"><input type="checkbox" id="connTls" /><span>TLS 加密 (rediss://)</span></label>
                </div>
                <div class="form-group" id="connTlsInsecureWrap" style="visibility:hidden;">
                    <label class="checkbox-label"><input type="checkbox" id="connTlsInsecure" /><span>跳过证书校验（自签名）</span></label>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>建连超时 (秒，可选)</label>
                    <input type="number" id="connConnectTimeout" placeholder="默认 5" min="1" />
                </div>
                <div class="form-group">
                    <label>命令超时 (秒，可选)</label>
                    <input type="number" id="connCommandTimeout" placeholder="默认 10" min="1" title="大 Key 整表读取慢时可调大" />
                </div>
            </div>
            <div class="form-group">
                <label for="connSeparator">Key 分隔符</label>
                <input type="text" id="connSeparator" placeholder=":" maxlength="4" />
            </div>
            <div class="modal-actions">
                <button class="secondary" id="modalTest">测试连接</button>
                <span id="testStatus"></span>
                <div class="spacer"></div>
                <button class="secondary" id="modalCancel">取消</button>
                <button class="primary" id="modalSave">保存连接</button>
            </div>
        </div>
    </div>

    <!-- ===== 新增 Key 对话框 ===== -->
    <div class="modal-overlay" id="addKeyModal">
        <div class="modal">
            <div class="modal-title"><svg class="logo-mark" aria-label="麦地新增Key Logo"><use href="#md-logo-mark" /></svg> 新增 Key</div>
            <div class="form-group">
                <label>Key 名称</label>
                <input type="text" id="addKeyName" placeholder="请输入 Key 名称" />
            </div>
            <div class="form-group">
                <label>值</label>
                <textarea id="addKeyValue" rows="6" placeholder="请输入 Key 的值" style="width:100%;resize:vertical;box-sizing:border-box;"></textarea>
            </div>
            <div class="form-group">
                <label>TTL（秒）</label>
                <input type="number" id="addKeyTtl" value="-1" placeholder="-1 表示永不过期" />
                <small style="color: var(--text-muted); font-size: 12px;">-1 表示永不过期，正整数表示过期秒数</small>
            </div>
            <div class="modal-actions">
                <button class="secondary" id="addKeyCancel">取消</button>
                <button class="primary" id="addKeySave">创建</button>
            </div>
        </div>
    </div>

    <!-- ===== Key 重命名 / 复制（共用一个对话框） ===== -->
    <div class="modal-overlay" id="keyOpModal">
        <div class="modal">
            <div class="modal-title"><svg class="logo-mark" aria-label="麦地 Key 操作 Logo"><use href="#md-logo-mark" /></svg> <span id="keyOpTitle">重命名 Key</span></div>
            <div class="form-group">
                <label>源 Key</label>
                <input type="text" id="keyOpSource" disabled />
            </div>
            <div class="form-group">
                <label>目标 Key 名称</label>
                <input type="text" id="keyOpDest" placeholder="请输入目标 Key 名称" />
                <small id="keyOpHint" style="color: var(--text-muted); font-size: 12px;"></small>
            </div>
            <div class="form-group">
                <label class="checkbox-label"><input type="checkbox" id="keyOpOverwrite" /><span>覆盖已存在的目标 Key</span></label>
                <small id="keyOpOverwriteHint" style="color: var(--text-muted); font-size: 12px;"></small>
            </div>
            <div class="modal-actions">
                <button class="secondary" id="keyOpCancel">取消</button>
                <button class="primary" id="keyOpConfirm">确定</button>
            </div>
        </div>
    </div>

    <!-- 通用确认对话框（替代原生 confirm，避免 WebView 兼容问题） -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal" style="width: 400px;">
            <div class="modal-title"><i class="fas fa-exclamation-triangle" style="color: var(--accent);"></i> <span id="confirmTitle">提示</span></div>
            <div id="confirmMessage" style="margin-bottom: 24px; line-height: 1.6; color: var(--text-secondary); word-break: break-all;"></div>
            <label id="confirmOption" style="display:none; align-items:center; gap:8px; margin-bottom: 20px; font-size: 13px; color: var(--text-secondary); cursor: pointer;">
                <input type="checkbox" id="confirmOptionBox" />
                <span id="confirmOptionLabel"></span>
            </label>
            <div class="modal-actions" style="justify-content: flex-end; gap: 10px;">
                <button class="secondary" id="confirmCancel">取消</button>
                <button class="primary" id="confirmOk" style="background: var(--danger, #e5484d); border-color: var(--danger, #e5484d);">删除</button>
            </div>
        </div>
    </div>

    <!-- ===== 更新对话框（「发现新版本」与「更新已就绪」共用一套结构） ===== -->
    <div class="modal-overlay" id="updateModal">
        <div class="modal" style="width: 460px;">
            <div class="modal-title"><i class="fas fa-cloud-arrow-down" style="color: var(--accent);"></i> <span id="updateModalTitle">发现新版本</span></div>
            <div id="updateModalBody" style="line-height: 1.7; color: var(--text-secondary); font-size: 13px;"></div>
            <div class="modal-actions" style="margin-top: 22px;">
                <button class="secondary" id="updateModalCancel">稍后</button>
                <button class="primary" id="updateModalOk">立即更新</button>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
