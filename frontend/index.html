                        .catch(err => {
                            showToast('导出连接配置失败: ' + err, 'error');
                            appendTerminal(`导出连接配置失败: ${err}`, 'error');
                        });
                });
            }

            // 从 JSON 文件导入连接配置（按 id 匹配，同 id 覆盖）
            let connImportFileInput = null;
            function importConnections() {
                if (!connImportFileInput) {
                    connImportFileInput = document.createElement('input');
                    connImportFileInput.type = 'file';
                    connImportFileInput.accept = '.json,application/json';
                    connImportFileInput.style.display = 'none';
                    document.body.appendChild(connImportFileInput);
                    connImportFileInput.addEventListener('change', () => {
                        const file = connImportFileInput.files && connImportFileInput.files[0];
                        connImportFileInput.value = '';
                        if (!file) return;
                        showConfirm(`将从「${file.name}」导入连接配置。已存在同 id 的连接会被覆盖。继续吗？`, {
                            title: '导入连接配置',
                            okText: '导入',
                        }).then((ok) => {
                            if (!ok) return;
                            const reader = new FileReader();
                            reader.onload = () => {
                                invoke('import_connections', { content: String(reader.result), overwrite: true })
                                    .then((res) => {
                                        const failed = res.failed ? res.failed.length : 0;
                                        const msg = `导入完成：新增/覆盖 ${res.imported}，跳过 ${res.skipped}，失败 ${failed}`;
                                        showToast(msg, failed > 0 ? 'error' : 'success');
                                        appendTerminal(`IMPORT → ${msg}`, failed > 0 ? 'error' : 'ok');
                                        if (failed > 0) {
                                            res.failed.slice(0, 5).forEach(f => appendTerminal(`  失败 ${f.name}: ${f.error}`, 'error'));
                                        }
                                        return loadConnections();
                                    })
                                    .catch(err => {
                                        showToast('导入连接配置失败: ' + err, 'error');
                                        appendTerminal(`导入连接配置失败: ${err}`, 'error');
                                    });
                            };
                            reader.readAsText(file);
                        });
                    });
                }
                connImportFileInput.click();
            }

            function connectTo(conn) {
                if (!conn) return Promise.reject(new Error('无连接信息'));
                appendTerminal(`正在连接 ${conn.name} (${conn.host}:${conn.port}) …`, '');
                // 直接建立连接（connect 内部会替换连接池中同 id 的连接）
                return invoke('connect', {
                    conn: {
                        id: conn.id,
                        name: conn.name,
                        host: conn.host,
                        port: conn.port,
                        type: conn.type || 'single',
                        readonly: !!conn.readonly,
                        separator: conn.separator || ':',
                        db: (conn.db !== undefined && conn.db !== null) ? conn.db : 0,
                        username: conn.username || null,
                        password: conn.password || null,
                    }
                }).then(() => {
                    if (conn && conn.id) onlineConns.add(conn.id);
                    currentConn = { ...conn, online: true };
                    return invoke('get_server_info', { connId: conn.id });
                }).then((info) => {
                    currentConn.info = info;
                    return info;
                });
            }

            function switchConnection(conn) {
                if (!conn) return;
                // 初始化逻辑数据库编号（旧连接配置可能没有 db 字段）
                if (conn.db === undefined || conn.db === null) conn.db = 0;
                currentConn = conn;
                renderConnections();
                updateStatus();
                // 切换连接时先清掉上一个连接的列表与分页游标，避免串数据
                resetKeyList();
                // 选中的 Key 属于上一个连接，必须一起清掉：否则详情区会拿空列表
                // 去查它，误报「Key 不存在」
                selectedKey = null;
                renderKeyTree();
                renderDetail();
                refreshDbSelector();
                connectTo(conn).then((info) => {
                    if (info) {
                        renderServerInfo(info);
                        // 更新连接状态为「已连接」并刷新底栏和左侧徽章
                        currentConn.online = true;
                        onlineConns.add(conn.id);
                        renderConnections();
                        updateStatus();
                        refreshDbSelector();
                        const mem = info.usedMemory ? formatAppBytes(Number(info.usedMemory)) : '-';
                        const days = info.uptimeSeconds > 0 ? Math.floor(info.uptimeSeconds / 86400) : 0;
                        const hrs = info.uptimeSeconds > 0 ? Math.floor((info.uptimeSeconds % 86400) / 3600) : 0;
                        appendTerminal(
                            `连接成功 · Redis ${info.redisVersion || ''} · 运行 ${days}天${hrs}时 · 内存 ${mem} · 连接 ${info.connectedClients || 0} · Keys ${info.dbKeys || 0}`,
                            'ok'
                        );
                        // 连接成功后加载真实 key 列表
                        loadKeys();
                    }
                }).catch(err => {
                    if (currentConn) {
                        currentConn.online = false;
                        onlineConns.delete(currentConn.id);
                    }
                    renderConnections();
                    updateStatus();
                    appendTerminal(`连接失败: ${err}`, 'error');
                    showToast('连接失败: ' + err, 'error');
                });
            }

            function renderServerInfo(info) {
                if (!info) return;
                const setStat = (id, txt) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = txt;
                };

                // Key 总数
                const keys = info.dbKeys !== undefined ? Number(info.dbKeys).toLocaleString() : '-';
                setStat('statKeys', keys);

                // 磁盘空间使用率（Redis 持久化数据所在磁盘）
                const diskEl = document.getElementById('statDisk');
                const diskWrap = document.getElementById('statDiskItem');
                if (info.disk && info.disk.usedPercent !== undefined && info.disk.usedPercent !== null) {
                    const pct = formatDiskPercent(info.disk.usedPercent);
                    setStat('statDisk', pct);
                    if (diskWrap) {
                        diskWrap.title = info.disk.path
                            ? `Redis 持久化目录: ${info.disk.path} · 磁盘已用 ${pct}`
                            : '磁盘已用 ' + pct;
                        diskWrap.style.cursor = 'help';
                    }
                } else {
                    setStat('statDisk', '-');
                }

                // 内存（B → 可读大小）
                const mem = info.usedMemory !== undefined ? formatAppBytes(Number(info.usedMemory)) : '-';
                setStat('statMem', mem);

                // 连接数
                setStat('statConn', info.connectedClients !== undefined ? String(info.connectedClients) : '-');
            }

            // 格式化为百分比（保留 1 位小数）
            function formatDiskPercent(p) {
                const n = Number(p);
                return (isFinite(n) ? Math.round(n * 10) / 10 : n) + '%';
            }

            function formatAppBytes(bytes) {
                if (!bytes) return '0B';
                const u = ['B','KB','MB','GB'];
                let i = 0, v = Number(bytes);
                while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
                return (i === 0 ? v : v.toFixed(1)) + u[i];
            }

            function updateStatus() {
                const online = currentConn && currentConn.online;
                statusDot.className = 'dot' + (online ? '' : ' disconnected');
                let suffix = '';
                if (online && currentConn.readonly) suffix = ' (只读)';
                statusLabel.textContent = online ?
                    `已连接 · ${currentConn.host}:${currentConn.port}${suffix}` :
                    `未连接 · ${currentConn ? currentConn.host : '无'}`;
                updateReadonlyUI();
            }

            // 根据当前连接是否为只读，启用/禁用写操作入口
            function updateReadonlyUI() {
                const readonly = !!(currentConn && currentConn.online && currentConn.readonly);
                const ids = ['btnAddKey', 'btnFlush', 'detailSave'];
                ids.forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) {
                        btn.disabled = readonly;
                        btn.title = readonly ? '只读连接，禁止写操作' : btn.getAttribute('data-orig-title') || '';
                        btn.style.cursor = readonly ? 'not-allowed' : '';
                    }
                });
            }

            // ---------- 渲染：Key 列表（后端分页 + 虚拟滚动 + 文件夹折叠） ----------
            // 每页向后端请求的 key 数（后端把它当作 SCAN 的 COUNT 提示，实际每页可能略多）
            const KEY_PAGE_SIZE = 100;
            // 虚拟滚动的行高，需与 CSS 里 .vt-row 的 height 一致
            let KEY_ROW_HEIGHT = 28;
            // 视口上下各多渲染几行，减少快速滚动时出现白屏
            const KEY_OVERSCAN = 8;
            // 距底部还有这么多行时就预取下一页
            const KEY_PREFETCH_ROWS = 10;

            // 分页状态：cursor 是后端返回的不透明游标，done 表示已扫描完当前 keyspace
            const keyPaging = {
                cursor: '0',
                done: false,
                loading: false,
                searchTerm: '',
                error: '',
                token: 0,
            };
            // 扁平化后的可见行（文件夹 + key），虚拟滚动的数据源
            let keyRows = [];
            // 每个连接已展开的文件夹路径集合，Map<connId, Set<folderPath>>
            let expandedCache = {};

            function sepCacheKey() {
                return (currentConn && currentConn.id) || 'default';
            }

            function getExpandedSet() {
                const k = sepCacheKey();
                if (!expandedCache[k]) expandedCache[k] = new Set();
                return expandedCache[k];
            }

            function getSeparator() {
                const sep = currentConn && currentConn.separator;
                return (typeof sep === 'string' && sep.length > 0) ? sep : ':';
            }

            // 渲染叶子 key 行
            function renderKeyRowHtml(key, depth) {
                const item = KEY_DATA[key] || {};
                return '<div class="tree-node">' +
                    '<div class="node-label node-key-select' + (selectedKey === key ? ' active' : '') + '" data-key="' + escapeHtml(key) + '" title="' + escapeHtml(key) + '" style="padding-left:' + (8 + depth * 16) + 'px">' +
                        '<span class="toggle" style="visibility:hidden;"><i class="fas fa-chevron-right"></i></span>' +
                        '<i class="fas fa-key icon-key"></i>' +
                        '<span class="key-name">' + escapeHtml(key) + '</span>' +
                        '<span class="key-type ' + (item.type || 'string') + '">' + (item.type || 'string') + '</span>' +
                    '</div></div>';
            }

            // 渲染文件夹行
            function renderFolderRowHtml(label, path, isOpen, depth) {
                return '<div class="tree-node"><div class="node-label node-folder-select' + (isOpen ? ' open' : '') + '" data-folder="' + escapeHtml(path) + '" style="padding-left:' + (8 + depth * 16) + 'px">' +
                    '<span class="toggle"><i class="fas fa-chevron-right' + (isOpen ? ' open' : '') + '"></i></span>' +
                    '<i class="fas fa-folder' + (isOpen ? '-open' : '') + ' icon-folder"></i>' +
                    '<span class="key-name">' + escapeHtml(label) + '</span>' +
                '</div></div>';
            }

            // 文件夹模式：keys 已排序。按 sep 组织成目录树，展开的目录输出后续行。
            function buildFolderRows(keys, sep, expanded, depth, dirPath, out) {
                const prefix = dirPath ? dirPath + sep : '';
                const childDirs = new Set();
                const leafKeys = [];
                keys.forEach(function (k) {
                    if (!k.startsWith(prefix)) return;
                    const rest = k.slice(prefix.length);
                    if (rest === '') return;
                    const idx = rest.indexOf(sep);
                    if (idx === -1) {
                        leafKeys.push(k); // 直接子 key（完整路径）
                    } else {
                        childDirs.add(prefix + rest.slice(0, idx)); // 直接子目录
                    }
                });
                // 先文件件（按路径），再 key —— 与折叠前的展示顺序一致
                const dirList = Array.from(childDirs).sort();
                for (let i = 0; i < dirList.length; i++) {
                    const d = dirList[i];
                    const isOpen = expanded.has(d);
                    out.push({ kind: 'folder', path: d, label: d.split(sep).pop(), isOpen: isOpen, depth: depth });
                    if (isOpen) buildFolderRows(keys, sep, expanded, depth + 1, d, out);
                }
                const leafList = leafKeys.sort();
                for (let j = 0; j < leafList.length; j++) {
                    out.push({ kind: 'key', key: leafList[j], depth: depth });
                }
            }

            // 由已加载的 key 重建扁平行列表（文件夹展开状态变化、数据变化后调用）
            function rebuildKeyRows() {
                const list = Object.keys(KEY_DATA).sort((a, b) => a.localeCompare(b));
                const sep = getSeparator();
                const rows = [];
                if (keyPaging.searchTerm || !sep) {
                    // 搜索时不折叠文件夹：命中的是 key 本身，折叠起来反而看不到结果
                    for (let i = 0; i < list.length; i++) {
                        rows.push({ kind: 'key', key: list[i], depth: 0 });
                    }
                } else {
                    buildFolderRows(list, sep, getExpandedSet(), 0, '', rows);
                }
                keyRows = rows;
            }

            // Key 树的空态 / 占位提示
            function keyTreeHintHtml(icon, text, loading) {
                return '<div style="padding:24px 16px;color:var(--text-muted);text-align:center;font-size:13px;">' +
                    '<i class="fas ' + (loading ? 'fa-spinner fa-spin' : icon) + '" style="font-size:22px;display:block;margin-bottom:8px;opacity:.4;"></i>' +
                    escapeHtml(text) + '</div>';
            }

            // 虚拟滚动需要的骨架：占位层 + 底部状态条
            function ensureKeyTreeSkeleton() {
                if (document.getElementById('keyTreeSpacer')) return;
                keyTreeEl.innerHTML = '<div class="vt-spacer" id="keyTreeSpacer"></div>' +
                    '<div class="vt-status" id="keyTreeStatus"></div>';
            }

            function updateKeyTreeStatus() {
                const el = document.getElementById('keyTreeStatus');
                if (!el) return;
                if (keyPaging.loading) {
                    el.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 加载中…';
                    return;
                }
                const scope = keyPaging.searchTerm ? '匹配 ' : '已加载 ';
                const n = allKeys.length;
                if (keyPaging.done) {
                    el.textContent = scope + n + ' 个 Key（已全部加载）';
                    return;
                }
                // 文件夹折叠起来时列表可能撑不满视口，滚不动就永远触发不了加载；
                // 所以除了滚动预取，这里再给一个显式入口
                el.innerHTML = scope + n + ' 个 Key · <button type="button" class="vt-more">加载更多</button>';
            }

            // 只渲染视口内的行（虚拟滚动）
            function renderKeyWindow() {
                const spacer = document.getElementById('keyTreeSpacer');
                if (!spacer) return;
                const total = keyRows.length;
                spacer.style.height = (total * KEY_ROW_HEIGHT) + 'px';
                if (total === 0) {
                    spacer.innerHTML = '';
                    updateKeyTreeStatus();
                    return;
                }
                const viewHeight = keyTreeEl.clientHeight || 400;
                const first = Math.max(0, Math.floor(keyTreeEl.scrollTop / KEY_ROW_HEIGHT) - KEY_OVERSCAN);
                const last = Math.min(total, Math.ceil((keyTreeEl.scrollTop + viewHeight) / KEY_ROW_HEIGHT) + KEY_OVERSCAN);
                let html = '';
                for (let i = first; i < last; i++) {
                    const row = keyRows[i];
                    const inner = row.kind === 'folder'
                        ? renderFolderRowHtml(row.label, row.path, row.isOpen, row.depth)
                        : renderKeyRowHtml(row.key, row.depth);
                    html += '<div class="vt-row" style="top:' + (i * KEY_ROW_HEIGHT) + 'px">' + inner + '</div>';
                }
                spacer.innerHTML = html;
                // 行高自愈：CSS 与 JS 常量不一致时按真实高度重算一次
                const probe = spacer.firstElementChild;
                if (probe && probe.offsetHeight > 0 && probe.offsetHeight !== KEY_ROW_HEIGHT) {
                    KEY_ROW_HEIGHT = probe.offsetHeight;
                    renderKeyWindow();
                    return;
                }
                updateKeyTreeStatus();
            }

            // 滚动接近底部时预取下一页
            function maybeLoadNextPage() {
                if (keyPaging.done || keyPaging.loading) return;
                const remain = keyTreeEl.scrollHeight - keyTreeEl.scrollTop - keyTreeEl.clientHeight;
                if (remain <= KEY_ROW_HEIGHT * KEY_PREFETCH_ROWS) loadKeyPage();
            }

            // 清空本地列表与分页状态（断开连接、切换连接、重新加载前调用）
            function resetKeyList() {
                keyPaging.token += 1;
                keyPaging.cursor = '0';
                keyPaging.done = false;
                keyPaging.loading = false;
                keyPaging.searchTerm = keySearch ? keySearch.value.trim() : '';
                keyPaging.error = '';
                KEY_DATA = {};
                allKeys = [];
                keyRows = [];
                keyTreeEl.scrollTop = 0;
            }

            // 本地插入或更新一个 key（新增成功、分页结果合并时调用）
            function upsertKeyEntry(key, type, ttl) {
                const existing = KEY_DATA[key];
                if (existing) {
                    // SCAN 在键空间变动时可能重复返回同一个 key：更新而不重复入列
                    existing.type = type;
                    existing.ttl = ttl;
                    return existing;
                }
                // KEY_DATA 与 allKeys 共用同一个对象，两处状态不会再走偏
                const entry = { key: key, type: type, ttl: ttl, value: '' };
                KEY_DATA[key] = entry;
                allKeys.push(entry);
                return entry;
            }

            // 本地移除一个 key（删除成功后调用，避免整表重扫）
            function removeKeyEntry(key) {
                delete KEY_DATA[key];
                const idx = allKeys.findIndex(k => k.key === key);
                if (idx >= 0) allKeys.splice(idx, 1);
            }

            // 从第一页重新加载（连接切换、搜索、刷新、导入后调用）
            function loadKeys() {
                if (!currentConn || !currentConn.id) {
                    resetKeyList();
                    renderKeyTree();
                    return Promise.resolve(allKeys);
                }
                resetKeyList();
                return loadKeyPage(true);
            }

            /**
             * 拉取一页 key 并追加到列表。
             *
             * `reset` 为 true 表示这一页是重置后的首页（此时列表刚被清空）。
             */
            function loadKeyPage(reset) {
                if (!currentConn || !currentConn.id) return Promise.resolve(allKeys);
                if (keyPaging.loading && !reset) return Promise.resolve(allKeys);
                if (keyPaging.done) return Promise.resolve(allKeys);

                const token = keyPaging.token;
                keyPaging.loading = true;
                keyPaging.error = '';
                renderKeyTree();

                return invoke('list_keys', {
                    connId: currentConn.id,
                    cursor: keyPaging.cursor,
                    count: KEY_PAGE_SIZE,
                    pattern: keyPaging.searchTerm || null,
                }).then((page) => {
                    // 请求期间连接/搜索词变过：这批结果已经过期，直接丢弃
                    if (token !== keyPaging.token) return allKeys;
                    const items = (page && page.keys) || [];
                    for (const it of items) {
                        const type = it.type || 'string';
                        const ttl = it.ttl !== undefined ? it.ttl : -1;
                        upsertKeyEntry(it.key, type, ttl);
                    }
                    keyPaging.cursor = (page && page.nextCursor) ? page.nextCursor : '0';
                    keyPaging.done = keyPaging.cursor === '0';
                    renderKeyTree();
                    return allKeys;
                }).catch((err) => {
                    if (token === keyPaging.token) {
                        // 保留已加载的部分，只把失败原因记下来（空列表时提示里会显示）
                        keyPaging.error = String(err);
                        console.error('加载 Key 列表失败', err);
                        showToast('加载 Key 列表失败: ' + err, 'error');
                    }
                    return allKeys;
                }).finally(() => {
                    if (token === keyPaging.token) {
                        keyPaging.loading = false;
                        renderKeyTree();
                    }
                });
            }

            /**
             * 渲染 Key 列表：先处理未连接 / 无数据的空态，否则重建行并渲染可视窗口。
             */
            function renderKeyTree() {
                const isConnected = currentConn && currentConn.online;
                if (!isConnected) {
                    keyRows = [];
                    keyTreeEl.innerHTML = keyTreeHintHtml('fa-plug', '请先连接 Redis 服务器', false);
                    return;
                }
                rebuildKeyRows();
                if (keyRows.length === 0) {
                    const searching = !!keyPaging.searchTerm;
                    if (keyPaging.error) {
                        keyTreeEl.innerHTML = keyTreeHintHtml('fa-exclamation-triangle', '加载失败：' + keyPaging.error, false);
                    } else {
                        keyTreeEl.innerHTML = keyTreeHintHtml(
                            'fa-inbox',
                            searching ? '没有匹配的 Key' : '暂无 Key\n点击「新增 Key」创建',
                            keyPaging.loading
                        );
                    }
                    return;
                }
                ensureKeyTreeSkeleton();
                renderKeyWindow();
            }

            // ---------- 渲染：Key 详情 ----------
            function renderDetail() {
                if (!selectedKey) {
                    keyDetailEl.innerHTML = `
                        <div class="empty-state">
                            <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="56" height="56"><defs><linearGradient id="md-favicon-gradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f9c75e" /><stop offset="100%" stop-color="#f5b342" /></linearGradient></defs><ellipse cx="44" cy="28" rx="24" ry="9" fill="url(#md-favicon-gradient)" /><path d="M20 28 L20 70 Q20 78 44 78 Q68 78 68 70 L68 28" fill="url(#md-favicon-gradient)" /><circle cx="72" cy="72" r="20" fill="#ffffff" stroke="#f5b342" stroke-width="4" /><text x="72" y="78" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="15" fill="#f5b342">MR</text></svg>
                            <h3>选择一个 Key</h3>
                            <p>从左侧树中点击任意 Key 查看详细内容和值</p>
                        </div>
                    `;
                    return;
                }
                const item = allKeys.find(k => k.key === selectedKey);
                if (!item) {
                    keyDetailEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>Key 不存在</h3>
                            <p>该 Key 可能已被删除或不存在</p>
                        </div>
                    `;
                    return;
                }

                const typeClass = item.type || 'string';
                const typeLabel = typeClass.toUpperCase();
                const ttl = item.ttl !== undefined ? item.ttl : -1;
                // 只读连接（已连接且配置为只读）时，禁用「保存」按钮
                const readonlyConn = !!(currentConn && currentConn.online && currentConn.readonly);

                const valueActions = buildValueEditorActions(typeClass);

                let valueHtml = '';
                if (typeClass === 'string') {
                    valueHtml = `
                        <textarea id="valueEditor" placeholder="加载中…">${escapeHtml(item.value || '')}</textarea>
                    `;
                    // 从后端拉取真实值（异步）
                    if (currentConn && currentConn.id) {
                        const thisKey = selectedKey;
                        invoke('get_string', { connId: currentConn.id, key: thisKey })
                            .then(v => {
                                if (v === null || v === undefined) {
                                    v = '(nil)';
                                }
                                const editor = document.getElementById('valueEditor');
                                if (editor && selectedKey === thisKey) {
                                    editor.value = v;
                                }
                            })
                            .catch(() => { /* 忽略 */ });
                    }
                } else if (typeClass === 'hash' || typeClass === 'list' || typeClass === 'set' || typeClass === 'zset') {
                    // 集合类型：先占位，随后由 wireCollView 从后端拉取内容渲染
                    valueHtml = `
                        <div id="collView" class="coll-view" data-type="${typeClass}"><div class="coll-empty">加载中…</div></div>
                    `;
                } else {
                    valueHtml = `
                        <div class="coll-empty">暂不支持此类型</div>
                    `;
                }

                const ttlDisplay = ttl === -1 ? '永不过期' : `${ttl}s`;
                const ttlDisabled = readonlyConn ? ' disabled' : '';
                // 内容大小：string 取列表值，集合类型取最近一次加载到的内容
                const cachedForSize = contentCache[selectedKey + '|' + typeClass];
                const sizeSource = typeClass === 'string' ? item.value : cachedForSize;
                const sizeBytes = sizeSource ? JSON.stringify(sizeSource).length : 0;

                keyDetailEl.innerHTML = `
                    <div class="detail-header">
                        <div class="key-title">
                            <span>${selectedKey}</span>
                            <span class="type-badge ${typeClass}">${typeLabel}</span>
                        </div>
                        <span class="ttl"><i class="far fa-clock"></i> <input type="number" id="detailTtl" value="${ttl}" title="TTL（秒），-1 表示永不过期"${ttlDisabled} /></span>
                        <div class="detail-actions">
                            <button class="primary" id="detailSave"${readonlyConn ? ' disabled' : ''} data-orig-title="保存修改" title="${readonlyConn ? '只读连接，禁止写操作' : '保存修改'}"><i class="fas fa-save"></i> 保存</button>
                            <button id="detailRefresh"><i class="fas fa-sync-alt"></i> 刷新</button>
                            <button class="danger" id="detailDelete"><i class="fas fa-trash-alt"></i> 删除</button>
                        </div>
                    </div>
                    <div class="detail-body">
                        <div class="value-editor">
                            <div class="editor-toolbar">
                                ${valueActions}
                            </div>
                            ${valueHtml}
                        </div>
                        <div class="value-footer">
                            <div class="info">
                                <span><i class="far fa-file"></i> 类型: ${typeLabel}</span>
                                <span><i class="far fa-clock"></i> TTL: ${ttlDisplay}</span>
                            </div>
                            <span>大小: ${sizeBytes} 字节</span>
                        </div>
                    </div>
                `;

                const saveBtn = document.getElementById('detailSave');
                if (saveBtn) {
                    saveBtn.addEventListener('click', () => {
                        if (!currentConn || !currentConn.id) {
                            showToast('请先连接 Redis 服务器', 'error');
                            return;
                        }
                        if (currentConn.readonly) {
                            showToast('只读连接，禁止写操作', 'error');
                            appendTerminal(`保存 Key "${selectedKey}" 失败: 当前为只读连接，禁止写操作`, 'error');
                            return;
                        }
                        const ttlInput = document.getElementById('detailTtl');
                        const ttlResult = parseTtl(ttlInput ? ttlInput.value : '-1');
                        if (!ttlResult.ok) {
                            showToast(ttlResult.message, 'error');
                            if (ttlInput) ttlInput.focus();
                            return;
                        }
                        // 集合类型：字段级修改在表格行内即时保存，顶部「保存」只负责 TTL
                        if (typeClass !== 'string') {
                            saveBtn.disabled = true;
                            invoke('set_key_ttl', { connId: currentConn.id, key: selectedKey, ttl: ttlResult.ttl })
                                .then(() => {
                                    showToast('TTL 已更新', 'success');
                                    appendTerminal(ttlResult.ttl > 0 ? `EXPIRE ${selectedKey} ${ttlResult.ttl} → OK` : `PERSIST ${selectedKey} → OK`, 'ok');
                                    if (KEY_DATA[selectedKey]) KEY_DATA[selectedKey].ttl = ttlResult.ttl;
                                    renderKeyTree();
                                })
                                .catch(err => {
                                    showToast('TTL 更新失败: ' + err, 'error');
                                    appendTerminal(`修改 TTL 失败: ${err}`, 'error');
                                })
                                .finally(() => {
                                    saveBtn.disabled = false;
                                });
                            return;
                        }
                        const editor = document.getElementById('valueEditor');
                        if (!editor) {
                            showToast('此类型不支持直接修改', 'info');
                            return;
                        }
                        const value = editor.value;
                        saveBtn.disabled = true;
                        invoke('set_key', { connId: currentConn.id, key: selectedKey, value: value, ttl: ttlResult.ttl })
                            .then(() => {
                                const ttlArg = ttlResult.ttl > 0 ? ` EX ${ttlResult.ttl}` : '';
                                appendTerminal(`SET ${selectedKey}${ttlArg} → OK`, 'ok');
                                showToast('Key 已保存', 'success');
                                if (KEY_DATA[selectedKey]) {
                                    KEY_DATA[selectedKey].value = value;
                                    KEY_DATA[selectedKey].ttl = ttlResult.ttl;
                                }
                                renderKeyTree();
                                renderDetail();
                            })
                            .catch(err => {
                                showToast('保存失败: ' + err, 'error');
                                appendTerminal(`保存 Key "${selectedKey}" 失败: ${err}`, 'error');
                            })
                            .finally(() => {
                                saveBtn.disabled = false;
                            });
                    });
                }
                const refreshBtn = document.getElementById('detailRefresh');
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', () => {
                        renderDetail();
                        appendTerminal(`刷新 Key "${selectedKey}"`, '');
                    });
                }
                const deleteBtn = document.getElementById('detailDelete');
                if (deleteBtn) {
                    deleteBtn.addEventListener('click', () => {
                        const keyToDelete = selectedKey;
                        if (!keyToDelete) return;
                        showConfirm(`确定要删除 Key「${keyToDelete}」吗？此操作不可恢复。`, { title: '删除 Key' }).then((ok) => {
                            if (!ok) return;
                            if (!currentConn || !currentConn.id) {
                                showToast('未连接到 Redis', 'error');
                                return;
                            }
                            invoke('del_key', { connId: currentConn.id, keys: [keyToDelete] })
                                .then((n) => {
                                    appendTerminal(`删除 Key "${keyToDelete}"${n > 0 ? '' : '（不存在）'}`, n > 0 ? 'ok' : '');
                                    showToast(n > 0 ? 'Key 已删除' : 'Key 不存在', n > 0 ? 'success' : 'error');
                                    if (selectedKey === keyToDelete) selectedKey = null;
                                    // 本地摘掉这一条：分页模式下重扫列表会把已加载的页
                                    // 和滚动位置一起丢掉
                                    removeKeyEntry(keyToDelete);
                                    renderKeyTree();
                                    renderDetail();
                                })
                                .catch(err => {
                                    console.error('删除 Key 失败', err);
                                    showToast('删除 Key 失败: ' + err, 'error');
                                });
                        });
                    });
                }

                // 获取当前详情展示的文本值（string 取编辑器内容，集合类型取最近一次加载的内容）
                const currentDetailValue = () => {
                    const editor = document.getElementById('valueEditor');
                    if (editor) return editor.value;
                    const cached = contentCache[selectedKey + '|' + typeClass];
                    return cached != null ? JSON.stringify(cached, null, 2) : '';
                };

                const formatBtn = document.getElementById('editorFormat');
                if (formatBtn) {
                    formatBtn.addEventListener('click', () => {
                        const editor = document.getElementById('valueEditor');
                        if (!editor) return;
                        const formatted = formatJsonText(editor.value);
                        editor.value = formatted;
                        appendTerminal(`格式化 Key "${selectedKey}" 的值`, 'ok');
                        showToast('已格式化', 'success');
                    });
                }

                const copyBtn = document.getElementById('editorCopy');
                if (copyBtn) {
                    copyBtn.addEventListener('click', () => {
                        const text = currentDetailValue();
                        const done = () => { showToast('已复制到剪贴板', 'success'); };
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
                        } else {
                            fallbackCopy(text, done);
                        }
                    });
                }

                // 集合类型：加载并渲染字段级编辑表格
                if (typeClass === 'hash' || typeClass === 'list' || typeClass === 'set' || typeClass === 'zset') {
                    wireCollView(typeClass);
                }
            }

            // ---------- 集合类型（Hash / List / Set / ZSet）字段级编辑 ----------
            // 从后端加载 key 内容并渲染可编辑表格；key 切换后异步返回时做校验
            function wireCollView(type) {
                const view = document.getElementById('collView');
                if (!view || !currentConn || !currentConn.id) return;
                const key = selectedKey;
                invoke(COLL_READ_CMD[type], { connId: currentConn.id, key })
                    .then((data) => {
                        if (selectedKey !== key) return;
                        contentCache[key + '|' + type] = data;
                        renderCollRows(view, type, key, data);
                    })
                    .catch((err) => {
                        if (selectedKey !== key) return;
                        view.innerHTML = `<div class="coll-empty">加载失败：${escapeHtml(String(err))}</div>`;
                    });
            }

            function renderCollRows(view, type, key, data) {
                const readonly = !!(currentConn && currentConn.online && currentConn.readonly);
                const dis = readonly ? ' disabled' : '';
                const btn = (act, attrs, icon, title) =>
                    `<button class="coll-btn${act.endsWith('del') ? ' danger' : ''}" data-act="${act}" ${attrs} title="${title}"${dis}><i class="fas fa-${icon}"></i></button>`;
                let rows = '';
                let emptyTip = '';
                if (type === 'hash') {
                    const arr = data || [];
                    rows = arr.map((it, i) => `
                        <div class="coll-row">
                            <span class="coll-key" title="${escapeHtml(it.field)}">${escapeHtml(it.field)}</span>
                            <input class="coll-input grow" id="collVal${i}" value="${escapeHtml(it.value)}"${dis} />
                            ${btn('hset', `data-field="${escapeHtml(it.field)}" data-input="collVal${i}"`, 'check', '保存字段')}
                            ${btn('hdel', `data-field="${escapeHtml(it.field)}"`, 'trash-alt', '删除字段')}
                        </div>`).join('');
                    rows += `
                        <div class="coll-row coll-add">
                            <input class="coll-input" id="collAddKey" placeholder="字段名"${dis} />
                            <input class="coll-input grow" id="collAddVal" placeholder="字段值"${dis} />
                            ${btn('hadd', '', 'plus', '添加字段')}
                        </div>`;
                    if (!arr.length) emptyTip = '<div class="coll-empty">空 Hash</div>';
                } else if (type === 'list') {
                    const arr = data || [];
                    rows = arr.map((it) => `
                        <div class="coll-row">
                            <span class="idx">${it.index}</span>
                            <input class="coll-input grow" id="collVal${it.index}" value="${escapeHtml(it.value)}"${dis} />
                            ${btn('lset', `data-idx="${it.index}" data-input="collVal${it.index}"`, 'check', '保存元素')}
                            ${btn('ldel', `data-val="${escapeHtml(it.value)}"`, 'trash-alt', '删除元素')}
                        </div>`).join('');
                    rows += `
                        <div class="coll-row coll-add">
                            <input class="coll-input grow" id="collAddVal" placeholder="新元素"${dis} />
                            ${btn('lpush', '', 'angle-left', '左端插入')}
                            ${btn('rpush', '', 'angle-right', '右端插入')}
                        </div>`;
                    if (!arr.length) emptyTip = '<div class="coll-empty">空 List</div>';
                } else if (type === 'set') {
                    const arr = data || [];
                    rows = arr.map((it, i) => `
                        <div class="coll-row">
                            <span class="idx">${i + 1}</span>
                            <input class="coll-input grow" id="collVal${i}" value="${escapeHtml(it)}"${dis} />
                            ${btn('sset', `data-old="${escapeHtml(it)}" data-input="collVal${i}"`, 'check', '保存成员（改名）')}
                            ${btn('sdel', `data-val="${escapeHtml(it)}"`, 'trash-alt', '删除成员')}
                        </div>`).join('');
                    rows += `
                        <div class="coll-row coll-add">
                            <input class="coll-input grow" id="collAddVal" placeholder="新成员"${dis} />
                            ${btn('sadd', '', 'plus', '添加成员')}
                        </div>`;
                    if (!arr.length) emptyTip = '<div class="coll-empty">空 Set</div>';
                } else if (type === 'zset') {
                    const arr = data || [];
                    rows = arr.map((it, i) => `
                        <div class="coll-row">
                            <span class="idx">${i + 1}</span>
                            <input class="coll-input grow" id="collMember${i}" value="${escapeHtml(it.member)}"${dis} />
                            <input class="coll-input coll-score" id="collScore${i}" value="${it.score}"${dis} />
                            ${btn('zset', `data-old="${escapeHtml(it.member)}" data-i="${i}"`, 'check', '保存成员与分值')}
                            ${btn('zdel', `data-val="${escapeHtml(it.member)}"`, 'trash-alt', '删除成员')}
                        </div>`).join('');
                    rows += `
                        <div class="coll-row coll-add">
                            <input class="coll-input grow" id="collAddKey" placeholder="成员"${dis} />
                            <input class="coll-input coll-score" id="collAddScore" placeholder="分值" value="0"${dis} />
                            ${btn('zadd', '', 'plus', '添加成员')}
                        </div>`;
                    if (!arr.length) emptyTip = '<div class="coll-empty">空 ZSet</div>';
                }
                view.innerHTML = emptyTip + rows;
                view.querySelectorAll('[data-act]').forEach(el => {
                    el.addEventListener('click', () => runCollAction(el, type, key));
                });
            }

            // 执行字段级编辑操作，成功后刷新当前内容区
            function runCollAction(el, type, key) {
                if (!currentConn || !currentConn.id) return;
                if (currentConn.readonly) {
                    showToast('只读连接，禁止写操作', 'error');
                    return;
                }
                const act = el.dataset.act;
                const connId = currentConn.id;
                const valOf = (id) => {
                    const input = document.getElementById(id);
                    return input ? input.value : '';
                };
                const require = (v, msg, focusId) => {
                    if (v !== '') return true;
                    showToast(msg, 'error');
                    const f = document.getElementById(focusId);
                    if (f) f.focus();
                    return false;
                };
                const finish = (p, echoOk, echoErr) => {
                    Promise.resolve(p)
                        .then(() => {
                            showToast('已保存', 'success');
                            appendTerminal(echoOk, 'ok');
                            wireCollView(type);
                        })
                        .catch((err) => {
                            showToast('操作失败: ' + err, 'error');
                            appendTerminal(`${echoErr}: ${err}`, 'error');
                        });
                };

                if (act === 'hset') {
                    const field = el.dataset.field;
                    const value = valOf(el.dataset.input);
                    if (!require(value, '请输入字段值', el.dataset.input)) return;
                    finish(
                        invoke('hash_set_field', { connId, key, field, value }),
                        `HSET ${key} ${field} "${value}" → OK`,
                        `HSET ${key} ${field}`
                    );
                } else if (act === 'hdel') {
                    const field = el.dataset.field;
                    finish(
                        invoke('hash_del_fields', { connId, key, fields: [field] }),
                        `HDEL ${key} ${field} → OK`,
                        `HDEL ${key} ${field}`
                    );
                } else if (act === 'hadd') {
                    const field = valOf('collAddKey');
                    const value = valOf('collAddVal');
                    if (!require(field, '请输入字段名', 'collAddKey')) return;
                    if (!require(value, '请输入字段值', 'collAddVal')) return;
                    finish(
                        invoke('hash_set_field', { connId, key, field, value }),
                        `HSET ${key} ${field} "${value}" → OK`,
                        `HSET ${key} ${field}`
                    );
                } else if (act === 'lset') {
                    const index = parseInt(el.dataset.idx, 10);
                    const value = valOf(el.dataset.input);
                    if (!require(value, '请输入元素值', el.dataset.input)) return;
                    finish(
                        invoke('list_set_element', { connId, key, index, value }),
                        `LSET ${key} ${index} "${value}" → OK`,
                        `LSET ${key} ${index}`
                    );
                } else if (act === 'ldel') {
                    const value = el.dataset.val;
                    finish(
                        invoke('list_del_element', { connId, key, value }),
                        `LREM ${key} 1 "${value}" → OK`,
                        `LREM ${key} "${value}"`
                    );
                } else if (act === 'lpush' || act === 'rpush') {
                    const value = valOf('collAddVal');
                    if (!require(value, '请输入新元素', 'collAddVal')) return;
                    const left = act === 'lpush';
                    finish(
                        invoke('list_push_element', { connId, key, value, left }),
                        `${left ? 'LPUSH' : 'RPUSH'} ${key} "${value}" → OK`,
                        `${left ? 'LPUSH' : 'RPUSH'} ${key}`
                    );
                } else if (act === 'sadd') {
                    const member = valOf('collAddVal');
                    if (!require(member, '请输入新成员', 'collAddVal')) return;
                    finish(
                        invoke('set_add_member', { connId, key, member }),
                        `SADD ${key} "${member}" → OK`,
                        `SADD ${key} "${member}"`
                    );
                } else if (act === 'sset') {
                    const old = el.dataset.old;
                    const member = valOf(el.dataset.input);
                    if (!require(member, '请输入成员', el.dataset.input)) return;
                    // Set 成员不可原地修改：先加新值，再删旧值（同名时跳过删除）
                    finish(
                        invoke('set_add_member', { connId, key, member }).then(() => {
                            if (member === old) return Promise.resolve();
                            return invoke('set_del_member', { connId, key, member: old });
                        }),
                        `SREM ${key} "${old}" + SADD ${key} "${member}" → OK`,
                        `修改 Set 成员`
                    );
                } else if (act === 'sdel') {
                    const member = el.dataset.val;
                    finish(
                        invoke('set_del_member', { connId, key, member }),
                        `SREM ${key} "${member}" → OK`,
                        `SREM ${key} "${member}"`
                    );
                } else if (act === 'zadd') {
                    const member = valOf('collAddKey');
                    const score = parseFloat(valOf('collAddScore'));
                    if (!require(member, '请输入成员', 'collAddKey')) return;
                    if (!isFinite(score)) {
                        showToast('分值必须是数字', 'error');
                        return;
                    }
                    finish(
                        invoke('zset_add_member', { connId, key, member, score }),
                        `ZADD ${key} ${score} "${member}" → OK`,
                        `ZADD ${key} ${score} "${member}"`
                    );
                } else if (act === 'zset') {
                    const i = el.dataset.i;
                    const old = el.dataset.old;
                    const member = valOf('collMember' + i);
                    const score = parseFloat(valOf('collScore' + i));
                    if (!require(member, '请输入成员', 'collMember' + i)) return;
                    if (!isFinite(score)) {
                        showToast('分值必须是数字', 'error');
                        return;
                    }
                    finish(
                        invoke('zset_add_member', { connId, key, member, score }).then(() => {
                            if (member === old) return Promise.resolve();
                            return invoke('zset_del_member', { connId, key, member: old });
                        }),
                        `ZADD ${key} ${score} "${member}" → OK`,
                        `修改 ZSet 成员`
                    );
                } else if (act === 'zdel') {
                    const member = el.dataset.val;
                    finish(
                        invoke('zset_del_member', { connId, key, member }),
                        `ZREM ${key} "${member}" → OK`,
                        `ZREM ${key} "${member}"`
                    );
                }
            }

            // ---------- 终端 ----------
            function appendTerminal(text, type = '') {
                const line = document.createElement('div');
                line.className = 'line';
                const cls = type === 'ok' ? 'output ok' : type === 'error' ? 'output error' : 'output';
                line.innerHTML = `<span class="prompt">></span><span class="${cls}">${text}</span>`;
                terminalBody.appendChild(line);
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }

            function executeCommand(cmd) {
                const trimmed = cmd.trim();
                if (!trimmed) return;
                appendTerminal(escapeHtml(trimmed), '');
                terminalInput.value = '';
                if (trimmed.toLowerCase() === 'help') {
                    appendTerminal('命令直接转发到已连接的 Redis 服务器执行，例如 PING / GET key / HGETALL key / INFO / DBSIZE。只读连接会拦截写命令。', '');
                    terminalInput.focus();
                    return;
                }
                if (!currentConn || !currentConn.id || !currentConn.online) {
                    appendTerminal('未连接 Redis 服务器，请先建立连接', 'error');
                    terminalInput.focus();
                    return;
                }
                terminalSend.disabled = true;
                invoke('execute_command', { connId: currentConn.id, line: trimmed })
                    .then((text) => {
                        appendTerminal(escapeHtml(text || '(空结果)'), '');
                    })
                    .catch((err) => {
                        appendTerminal(escapeHtml(String(err)), 'error');
                    })
                    .finally(() => {
                        terminalSend.disabled = false;
                        terminalInput.focus();
                    });
            }

            // ---------- 模态框 ----------
            let editingConnId = null;

            function openModal(conn = null) {
                if (conn) {
                    editingConnId = conn.id;
                    modalTitle.textContent = '编辑连接';
                    document.getElementById('connName').value = conn.name;
                    document.getElementById('connHost').value = conn.host;
                    document.getElementById('connPort').value = conn.port;
                    document.getElementById('connUser').value = conn.username || '';
                    document.getElementById('connPass').value = conn.password || '';
                    document.getElementById('connReadonly').checked = !!conn.readonly;
                    document.getElementById('connCluster').checked = conn.type === 'cluster';
                    document.getElementById('connSeparator').value = conn.separator || '';
                } else {
                    editingConnId = null;
                    modalTitle.textContent = '新建连接';
                    document.getElementById('connName').value = '';
                    document.getElementById('connHost').value = '127.0.0.1';
                    document.getElementById('connPort').value = '6379';
                    document.getElementById('connUser').value = '';
                    document.getElementById('connPass').value = '';
                    document.getElementById('connReadonly').checked = false;
                    document.getElementById('connCluster').checked = false;
                    document.getElementById('connSeparator').value = '';
                }
                showTestStatus('', '');
                modal.classList.add('open');
                document.getElementById('connName').focus();
            }

            function closeModal() {
                modal.classList.remove('open');
                showTestStatus('', '');
            }

            // ---------- 通用确认对话框（替代原生 confirm） ----------
            let _confirmResolve = null;
            // 确认框里可选复选框的当前状态（showConfirm 传入 checkbox 时才有意义）
            let _confirmOptionChecked = false;
            function showConfirm(message, options = {}) {
                const cModal = document.getElementById('confirmModal');
                document.getElementById('confirmTitle').textContent = options.title || '提示';
                document.getElementById('confirmMessage').textContent = message;
                const okBtn = document.getElementById('confirmOk');
                okBtn.textContent = options.okText || '删除';
                if (options.danger !== false) {
                    okBtn.style.background = 'var(--danger, #e5484d)';
                    okBtn.style.borderColor = 'var(--danger, #e5484d)';
                } else {
                    okBtn.style.background = '';
                    okBtn.style.borderColor = '';
                }
                // 可选复选框：调用方用 getConfirmOption() 读取结果
                const optionRow = document.getElementById('confirmOption');
                const optionBox = document.getElementById('confirmOptionBox');
                if (options.checkbox && options.checkbox.label) {
                    _confirmOptionChecked = !!options.checkbox.checked;
                    optionBox.checked = _confirmOptionChecked;
                    document.getElementById('confirmOptionLabel').textContent = options.checkbox.label;
                    optionRow.style.display = 'flex';
                } else {
                    _confirmOptionChecked = false;
                    optionRow.style.display = 'none';
                }
                cModal.classList.add('open');
                return new Promise((resolve) => {
                    _confirmResolve = resolve;
                });
            }
            // 读取最近一次确认框里复选框的状态
            function getConfirmOption() {
                return _confirmOptionChecked;
            }
            function closeConfirm(result) {
                const cModal = document.getElementById('confirmModal');
                cModal.classList.remove('open');
                if (result) _confirmOptionChecked = document.getElementById('confirmOptionBox').checked;
                if (_confirmResolve) {
                    _confirmResolve(result);
                    _confirmResolve = null;
                }
            }
            // 确认框事件绑定
            document.getElementById('confirmOk').addEventListener('click', () => closeConfirm(true));
            document.getElementById('confirmCancel').addEventListener('click', () => closeConfirm(false));
            document.getElementById('confirmModal').addEventListener('click', (e) => {
                if (e.target.id === 'confirmModal') closeConfirm(false);
            });

            function saveConnection() {
                const name = document.getElementById('connName').value.trim();
                const host = document.getElementById('connHost').value.trim();
                const port = parseInt(document.getElementById('connPort').value) || 6379;
                if (!name || !host) {
                    showToast('请填写名称和主机', 'error');
                    return;
                }
                const id = editingConnId || ('conn_' + Date.now());
                let separator = document.getElementById('connSeparator').value;
                const conn = {
                    id: id,
                    name: name,
                    host: host,
                    port: port,
                    type: document.getElementById('connCluster').checked ? 'cluster' : 'single',
                    readonly: document.getElementById('connReadonly').checked,
                    separator: separator || ':',
                    username: document.getElementById('connUser').value || null,
                    password: document.getElementById('connPass').value || null,
                };
                invoke('save_connection', { conn }).then(() => {
                    closeModal();
                    showToast(editingConnId ? '连接已更新' : '连接已创建', 'success');
                    return loadConnections();
                }).then(() => {
                    if (currentConn) {
                        const updated = CONNECTIONS.find(c => c.id === currentConn.id);
                        if (updated) switchConnection(updated);
                    }
                }).catch(err => {
                    showToast('保存失败: ' + err, 'error');
                });
            }

            function showTestStatus(msg, type) {
                const el = document.getElementById('testStatus');
                el.textContent = msg;
                el.className = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
            }

            function testConnection() {
                const host = document.getElementById('connHost').value.trim();
                const port = parseInt(document.getElementById('connPort').value) || 0;
                if (!host || !port) {
                    showTestStatus('请填写主机和端口', 'error');
                    return;
                }

                const btn = document.getElementById('modalTest');
                const originalText = btn.textContent;
                btn.disabled = true;
                btn.textContent = '测试中…';
                showTestStatus('正在测试连接…', 'info');

                const conn = {
                    id: editingConnId || ('test_' + Date.now()),
                    name: document.getElementById('connName').value.trim() || '测试连接',
                    host: host,
                    port: port,
                    type: document.getElementById('connCluster').checked ? 'cluster' : 'single',
                    readonly: document.getElementById('connReadonly').checked,
                    separator: document.getElementById('connSeparator').value || ':',
                    username: document.getElementById('connUser').value || null,
                    password: document.getElementById('connPass').value || null,
                };

                invoke('test_connection', { conn })
                    .then(pong => {
                        showTestStatus('✓ 连接成功（' + pong + '）', 'success');
                    })
                    .catch(err => {
                        showTestStatus('✗ ' + err, 'error');
                    })
                    .finally(() => {
                        btn.disabled = false;
                        btn.textContent = originalText;
                    });
            }

            // ---------- Toast 提示 ----------
            // duration 默认 2.2 秒；更新失败的提示要留足阅读时间，调用方传 UPDATE_NOTICE_MS
            function showToast(msg, type = 'info', duration = 2200) {
                const existing = document.querySelector('.toast-notification');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast-notification';
                const colors = {
                    success: 'var(--green)',
                    error: 'var(--accent)',
                    info: 'var(--blue)',
                };
                toast.style.cssText = `
                    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
                    background: var(--bg-secondary); border: 1px solid var(--border-color);
                    padding: 10px 28px; border-radius: var(--radius);
                    font-size: 14px; color: var(--text-primary);
                    box-shadow: var(--shadow); z-index: 2000;
                    border-left: 4px solid ${colors[type] || colors.info};
                    animation: fadeIn 0.2s ease;
                    max-width: 90vw;
                `;
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, duration);
            }

            // ---------- 事件绑定 ----------
            document.getElementById('btnSidebarToggle').addEventListener('click', () => {
                layoutState.sidebarCollapsed = !layoutState.sidebarCollapsed;
                applyLayout();
            });

            let terminalCollapsed = false;
            // 终端折叠时同步隐藏其边界手柄
            function setTerminalCollapsed(collapsed) {
                terminalCollapsed = collapsed;
                terminalPanel.classList.toggle('collapsed', collapsed);
                termChevron.className = collapsed ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
                document.getElementById('splitterTerminal').classList.toggle('hidden', collapsed);
            }
            document.getElementById('terminalToggle').addEventListener('click', () => {
                setTerminalCollapsed(!terminalCollapsed);
            });
            termToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                setTerminalCollapsed(!terminalCollapsed);
            });

            terminalSend.addEventListener('click', () => executeCommand(terminalInput.value));
            terminalInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') executeCommand(terminalInput.value);
            });
            document.getElementById('termClear').addEventListener('click', () => {
                terminalBody.innerHTML = `
                    <div class="line"><span class="prompt">></span><span class="output ok">终端已清空</span></div>
                `;
            });

            // 搜索下推到后端 SCAN：输入停顿后再重扫，避免每敲一个字符就扫一遍 keyspace
            let keySearchTimer = null;
            keySearch.addEventListener('input', () => {
                clearTimeout(keySearchTimer);
                keySearchTimer = setTimeout(() => { loadKeys(); }, 300);
            });

            // Key 树的滚动与点击都用事件委托：虚拟滚动会不断替换行元素，
            // 逐元素绑定既浪费又容易漏绑
            keyTreeEl.addEventListener('scroll', () => {
                renderKeyWindow();
                maybeLoadNextPage();
            });
            keyTreeEl.addEventListener('click', (e) => {
                // 状态条上的「加载更多」
                if (e.target.closest('.vt-more')) {
                    loadKeyPage();
                    return;
                }
                const keyEl = e.target.closest('.node-key-select');
                if (keyEl) {
                    selectedKey = keyEl.dataset.key;
                    renderKeyWindow();
                    renderDetail();
                    return;
                }
                const folderEl = e.target.closest('.node-folder-select');
                if (!folderEl) return;
                const path = folderEl.dataset.folder;
                const expanded = getExpandedSet();
                if (expanded.has(path)) expanded.delete(path); else expanded.add(path);
                rebuildKeyRows();
                renderKeyWindow();
            });

            // 数据库切换
            if (dbSelect) dbSelect.addEventListener('change', onDbChange);

            document.getElementById('addConnectionBtn').addEventListener('click', () => openModal(null));
            document.getElementById('btnNewConnection').addEventListener('click', () => openModal(null));
            document.getElementById('btnImportConnections').addEventListener('click', importConnections);
            document.getElementById('btnExportConnections').addEventListener('click', exportConnections);

            document.getElementById('modalTest').addEventListener('click', testConnection);
            document.getElementById('modalCancel').addEventListener('click', closeModal);
            document.getElementById('modalSave').addEventListener('click', saveConnection);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            ['connName', 'connHost', 'connPort', 'connUser', 'connPass', 'connSeparator'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', () => showTestStatus('', ''));
            });
            document.getElementById('connReadonly').addEventListener('change', () => showTestStatus('', ''));
            document.getElementById('connCluster').addEventListener('change', () => showTestStatus('', ''));
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
                if (e.key === 'Enter' && modal.classList.contains('open')) saveConnection();
            });

            document.getElementById('btnRefresh').addEventListener('click', () => {
                loadKeys();
                showToast('已刷新', 'info');
                appendTerminal('刷新 Key 列表', '');
            });

            const addKeyModal = document.getElementById('addKeyModal');
            const addKeyNameInput = document.getElementById('addKeyName');
            const addKeyValueInput = document.getElementById('addKeyValue');
            const addKeyTtlInput = document.getElementById('addKeyTtl');

            function openAddKeyModal() {
                if (!currentConn || !currentConn.id) {
                    showToast('请先连接 Redis 服务器', 'error');
                    return;
                }
                if (currentConn.online !== true) {
                    showToast('请先连接 Redis 服务器', 'error');
                    return;
                }
                addKeyNameInput.value = '';
                addKeyValueInput.value = '';
                addKeyTtlInput.value = '-1';
                addKeyModal.classList.add('open');
                setTimeout(() => addKeyNameInput.focus(), 50);
            }

            function closeAddKeyModal() {
                addKeyModal.classList.remove('open');
            }

            function parseTtl(value) {
                if (value === '' || value === null || value === undefined) {
                    return { ok: false, message: '请输入 TTL' };
                }
                const trimmed = String(value).trim();
                if (!/^-?\d+$/.test(trimmed)) {
                    return { ok: false, message: 'TTL 必须为整数' };
                }
                const n = parseInt(trimmed, 10);
                if (n === -1) {
                    return { ok: true, ttl: -1 };
                }
                if (n <= 0) {
                    return { ok: false, message: 'TTL 必须为 -1 或正整数' };
                }
                return { ok: true, ttl: n };
            }

            function submitAddKey() {
                const trimmed = addKeyNameInput.value.trim();
                if (!trimmed) {
                    showToast('请输入 Key 名称', 'error');
                    addKeyNameInput.focus();
                    return;
                }
                // 查重只看已加载的部分：分页模式下未加载的 key 查不到，
                // 真冲突时 SET 会直接覆盖（与旧行为一致）
                if (KEY_DATA[trimmed]) {
                    showToast('Key 已存在', 'error');
                    return;
                }
                const ttlResult = parseTtl(addKeyTtlInput.value);
                if (!ttlResult.ok) {
                    showToast(ttlResult.message, 'error');
                    addKeyTtlInput.focus();
                    return;
                }
                const value = addKeyValueInput.value;
                document.getElementById('btnAddKey').disabled = true;
                invoke('set_key', { connId: currentConn.id, key: trimmed, value: value, ttl: ttlResult.ttl })
                    .then(() => {
                        closeAddKeyModal();
                        showToast(`Key "${trimmed}" 已创建`, 'success');
                        const ttlArg = ttlResult.ttl > 0 ? ` EX ${ttlResult.ttl}` : '';
                        appendTerminal(`SET ${trimmed} "${value}"${ttlArg} → OK`, 'ok');
                        // 本地插入这条新 key：重扫列表会丢掉已加载的分页与滚动位置，
                        // 而且新 key 未必落在第一页里
                        upsertKeyEntry(trimmed, 'string', ttlResult.ttl);
                        KEY_DATA[trimmed].value = value;
                        selectedKey = trimmed;
                        renderKeyTree();
                        renderDetail();
                    })
                    .catch(err => {
                        showToast('创建失败: ' + err, 'error');
                        appendTerminal(`SET ${trimmed} 失败: ${err}`, 'error');
                    })
                    .finally(() => {
                        document.getElementById('btnAddKey').disabled = false;
                    });
            }

            document.getElementById('btnAddKey').addEventListener('click', openAddKeyModal);
            document.getElementById('addKeyCancel').addEventListener('click', closeAddKeyModal);
            document.getElementById('addKeySave').addEventListener('click', submitAddKey);
            addKeyNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAddKey(); });
            addKeyValueInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submitAddKey(); });
            addKeyTtlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAddKey(); });
            addKeyModal.addEventListener('click', (e) => { if (e.target === addKeyModal) closeAddKeyModal(); });

            let importFileInput = null;
            document.getElementById('btnImport').addEventListener('click', () => {
                if (!currentConn || !currentConn.online) {
                    showToast('请先连接 Redis 服务器', 'error');
                    return;
                }
                if (currentConn.readonly) {
                    showToast('只读连接，禁止写操作', 'error');
                    return;
                }
                if (!importFileInput) {
                    importFileInput = document.createElement('input');
                    importFileInput.type = 'file';
                    importFileInput.accept = '.json,application/json';
                    importFileInput.style.display = 'none';
                    document.body.appendChild(importFileInput);
                    importFileInput.addEventListener('change', () => {
                        const file = importFileInput.files && importFileInput.files[0];
                        importFileInput.value = '';
                        if (!file) return;
                        showConfirm(`将从「${file.name}」导入 Key，已存在的同名 Key 将被覆盖。继续吗？`, { title: '导入 Key', okText: '导入' }).then((ok) => {
                            if (!ok) return;
                            const reader = new FileReader();
                            reader.onload = () => {
                                invoke('import_keys', { connId: currentConn.id, content: String(reader.result), overwrite: true })
                                    .then((res) => {
                                        const failed = res.failed ? res.failed.length : 0;
                                        const msg = `导入完成：成功 ${res.imported}，跳过 ${res.skipped}，失败 ${failed}`;
                                        showToast(msg, failed > 0 ? 'error' : 'success');
                                        appendTerminal(`IMPORT → ${msg}`, failed > 0 ? 'error' : 'ok');
                                        if (failed > 0) {
                                            res.failed.slice(0, 5).forEach(f => appendTerminal(`  失败 ${f.key}: ${f.error}`, 'error'));
                                        }
                                        loadKeys();
                                    })
                                    .catch((err) => {
                                        showToast('导入失败: ' + err, 'error');
                                        appendTerminal(`IMPORT 失败: ${err}`, 'error');
                                    });
                            };
                            reader.readAsText(file);
                        });
                    });
                }
                importFileInput.click();
            });
            document.getElementById('btnExport').addEventListener('click', () => {
                if (!currentConn || !currentConn.online) {
                    showToast('请先连接 Redis 服务器', 'error');
                    return;
                }
                const btn = document.getElementById('btnExport');
                btn.disabled = true;
                // 不传 keys：由后端全量枚举当前 keyspace。分页浏览时前端只持有已加载的
                // 那部分 key，拿它当导出范围会漏数据。
                invoke('export_keys', { connId: currentConn.id, keys: null })
                    .then((res) => {
                        const count = (res && res.count) || 0;
                        if (!count) {
                            showToast('当前数据库没有可导出的 Key', 'info');
                            return;
                        }
                        downloadJson(`maidi-export-${todayStamp()}.json`, res.content);
                        showToast(`已导出 ${count} 个 Key`, 'success');
                        appendTerminal(`EXPORT ${count} keys → OK`, 'ok');
                    })
                    .catch((err) => {
                        showToast('导出失败: ' + err, 'error');
                        appendTerminal(`EXPORT 失败: ${err}`, 'error');
                    })
                    .finally(() => {
                        btn.disabled = false;
                    });
            });

            // ---------- 初始化 ----------
            // ---------- 数据加载（从后端） ----------
            function loadConnections() {
                return invoke('list_connections').then(list => {
                    CONNECTIONS = (list || []).map(c => ({
                        id: c.id,
                        name: c.name,
                        host: c.host,
                        port: c.port,
                        type: c.type || 'single',
                        readonly: !!c.readonly,
                        separator: c.separator || ':',
                        username: c.username || '',
                        password: c.password || '',
                    }));
                    if (currentConn) {
                        const still = CONNECTIONS.find(c => c.id === currentConn.id);
                        if (!still) currentConn = null;
                    }
                    renderConnections();
                    updateStatus();
                    return CONNECTIONS;
                }).catch(err => {
                    console.error('加载连接失败', err);
                    showToast('加载连接失败: ' + err, 'error');
                });
            }

            // ==================== 静默更新 ====================
            // 配合后端四个命令：check_update / start_update_download /
            // get_update_progress / install_update_and_restart。
            // 下载跑在 Rust 侧的后台任务里（Update::download 自带签名校验），
            // 这里只轮询进度画底部进度条，所以下载期间应用照常可用，
            // 甚至刷新页面也不会中断 —— 进度和已下好的安装包都存在后端状态里。
            const UPDATE_POLL_MS = 500;
            // 更新失败提示的停留时长：8 秒后自动收起，不一直杵在页面底部
            const UPDATE_NOTICE_MS = 8000;
            // 同一个版本只提示一次「发现新版本」，避免每次启动都打扰
            const UPDATE_NOTICE_KEY = 'mc_cache_update_notified';
            // 标题栏的更新按钮默认不显示，只有查到新版本才出现；
            // 所以启动后要隔一阵再静默查一次，否则挂机久了发新版也看不到入口
            const UPDATE_RECHECK_MS = 30 * 60 * 1000;

            const updateBar = document.getElementById('updateBar');
            const updateBarFill = document.getElementById('updateBarFill');
            const updateBarIcon = document.getElementById('updateBarIcon');
            const updateBarText = document.getElementById('updateBarText');
            const updateBarPct = document.getElementById('updateBarPct');
            const updateBarRestart = document.getElementById('updateBarRestart');
            const updateBarDismiss = document.getElementById('updateBarDismiss');
            const updateModal = document.getElementById('updateModal');
            const updateModalTitle = document.getElementById('updateModalTitle');
            const updateModalBody = document.getElementById('updateModalBody');
            const updateModalOk = document.getElementById('updateModalOk');
            const updateModalCancel = document.getElementById('updateModalCancel');
            const updateDot = document.getElementById('updateDot');
            const btnCheckUpdate = document.getElementById('btnCheckUpdate');

            let updatePollTimer = null;
            // 弹窗确认按钮该做什么：发现新版本时是「立即更新」，已就绪时是「立即重启」
            let updateModalAction = null;
            // 用户手动收起了进度条（新版本开始下载时重置）
            let updateBarHidden = false;
            // 本轮下载是否已弹过「更新已就绪」，防止重复弹窗
            let updateReadyNotified = false;
            // 失败提示的自动收起定时器
            let updateFailTimer = null;

            function fmtSize(bytes) {
                if (!bytes || bytes < 1024) return (bytes || 0) + ' B';
                const units = ['KB', 'MB', 'GB'];
                let value = bytes / 1024;
                let i = 0;
                while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }
                return value.toFixed(1) + ' ' + units[i];
            }

            function showUpdateBar() {
                if (!updateBarHidden) updateBar.classList.add('open');
            }

            function clearUpdateFailTimer() {
                if (updateFailTimer) {
                    clearTimeout(updateFailTimer);
                    updateFailTimer = null;
                }
            }

            function hideUpdateBar() {
                clearUpdateFailTimer();
                updateBar.classList.remove('open', 'indeterminate', 'done', 'failed');
            }

            // 把后端返回的进度快照画到进度条上
