    <script>
        // =====================================================================
        //  JavaScript — 完整的交互逻辑 (与之前相同，但颜色已由 CSS 变量控制)
        // =====================================================================

        (function() {
            'use strict';

            // ---------- Tauri 后端调用封装 ----------
            function invoke(cmd, args) {
                if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) {
                    return window.__TAURI_INTERNALS__.invoke(cmd, args);
                }
                return Promise.reject(new Error('Tauri 环境未就绪'));
            }

            // ---------- 连接列表（由后端从本地配置加载） ----------
            let CONNECTIONS = [];

            // 扁平化 Key 列表 (用于搜索)
            function flattenKeys(obj, prefix = '') {
                let result = [];
                for (const [key, val] of Object.entries(obj)) {
                    const fullKey = prefix + key;
                    if (val.type === 'folder' && val.children) {
                        result = result.concat(flattenKeys(val.children, fullKey));
                    } else {
                        result.push({ key: fullKey, ...val });
                    }
                }
                return result;
            }
            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }
            // 尝试把字符串解析成 JSON，解析失败返回原值
            function tryParseJson(str) {
                if (typeof str !== 'string' || !str) return str;
                const s = str.trim();
                if (!(s.startsWith('{') || s.startsWith('['))) return str;
                try {
                    return JSON.parse(s);
                } catch (e) {
                    return str;
                }
            }
            // 格式化 JSON 文本：JSON 字符串原样解析并美化，否则尝试解析后美化，仍失败则原样返回
            function formatJsonText(text) {
                if (typeof text !== 'string') {
                    try { return JSON.stringify(text, null, 2); } catch (e) { return String(text); }
                }
                const trimmed = text.trim();
                if (!trimmed) return text;
                const parsed = tryParseJson(trimmed);
                if (typeof parsed !== 'string') {
                    try { return JSON.stringify(parsed, null, 2); } catch (e) { return text; }
                }
                const inner = tryParseJson(parsed);
                if (typeof inner !== 'string') {
                    try { return JSON.stringify(inner, null, 2); } catch (e) { return parsed; }
                }
                return text;
            }
            // 为编辑器生成格式化按钮（JSON 支持直接点击，其它类型用复制代替）
            function buildValueEditorActions(typeClass) {
                const actions = [];
                if (typeClass === 'string') {
                    actions.push('<button class="format" id="editorFormat" type="button" title="格式化 JSON"><i class="fas fa-magic"></i> 格式化</button>');
                }
                actions.push('<button class="copy" id="editorCopy" type="button" title="复制内容"><i class="far fa-copy"></i> 复制</button>');
                return actions.join('');
            }
            // 剪贴板降级方案：临时 textarea + execCommand
            function fallbackCopy(text, done) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    if (done) done();
                } catch (e) {
                    if (typeof done === 'function') { /* 保留占位，失败时静默 */ }
                }
            }
            // Key 树数据：初始为空，连接后由后端返回的真实数据重建
            let KEY_DATA = {};
            let allKeys = [];

            // ---------- 状态 ----------
            let currentConn = CONNECTIONS[0];
            let selectedKey = null; // 当前选中的 Key 全名
            let expandedFolders = new Set(['user:', 'session:', 'cache:']);
            // 已成功建立连接的 connId 集合（多个连接可同时在线）
            const onlineConns = new Set();

            // DOM 引用
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const connectionListEl = $('#connectionList');
            const keyTreeEl = $('#keyTree');
            const keyDetailEl = $('#keyDetail');
            const terminalBody = $('#terminalBody');
            const terminalInput = $('#terminalInput');
            const terminalSend = $('#terminalSend');
            const termToggleBtn = $('#termToggleBtn');
            const termChevron = $('#termChevron');
            const terminalPanel = $('#terminalPanel');
            const statusDot = $('#statusDot');
            const statusLabel = $('#statusLabel');
            const keySearch = $('#keySearch');
            const modal = $('#connectionModal');
            const modalTitle = $('#modalTitle');
            const dbSelectorWrap = $('#dbSelectorWrap');
            const dbSelect = $('#dbSelect');
            // Redis 逻辑数据库数量（默认 16 个：db0 - db15）
            const DB_COUNT = 16;

            // 初始化数据库选择下拉选项（仅创建一次）
            (function initDbOptions() {
                if (!dbSelect) return;
                dbSelect.innerHTML = '';
                for (let i = 0; i < DB_COUNT; i++) {
                    const opt = document.createElement('option');
                    opt.value = String(i);
                    opt.textContent = 'DB ' + i;
                    dbSelect.appendChild(opt);
                }
            })();

            // 根据当前连接刷新数据库选择框的可用状态与选中值
            // 集群只有 db0，不支持切换数据库，直接隐藏选择器
            function refreshDbSelector() {
                if (!dbSelect) return;
                const isCluster = !!(currentConn && currentConn.type === 'cluster');
                if (dbSelectorWrap) dbSelectorWrap.style.display = isCluster ? 'none' : '';
                if (isCluster) return;
                const online = !!(currentConn && currentConn.online);
                dbSelect.disabled = !online;
                let current = 0;
                if (currentConn && currentConn.db !== undefined && currentConn.db !== null) {
                    current = Number(currentConn.db);
                }
                if (dbSelect.value !== String(current)) dbSelect.value = String(current);
            }

            // 切换数据库（由下拉框 change 触发）
            function onDbChange() {
                if (!currentConn || !currentConn.id) return;
                if (currentConn.type === 'cluster') {
                    // 集群只有 db0，不支持切换
                    refreshDbSelector();
                    return;
                }
                if (!currentConn.online) {
                    refreshDbSelector();
                    return;
                }
                const db = parseInt(dbSelect.value, 10);
                if (isNaN(db) || (currentConn.db !== undefined && currentConn.db === db)) {
                    refreshDbSelector();
                    return;
                }
                dbSelect.disabled = true;
                appendTerminal(`正在切换到数据库 Db${db} …`, '');
                invoke('select_db', { connId: currentConn.id, db: db })
                    .then((dbIndex) => {
                        currentConn.db = dbIndex;
                        // 逻辑数据库已更换，清空选中的 Key 与搜索条件
                        selectedKey = null;
                        if (keySearch) keySearch.value = '';
                        renderDetail();
                        appendTerminal(`已切换到数据库 Db${dbIndex}`, 'ok');
                        // 刷新 key 列表与服务器信息
                        const infoP = invoke('get_server_info', { connId: currentConn.id })
                            .then((info) => { currentConn.info = info; renderServerInfo(info); return info; })
                            .catch(() => {});
                        return Promise.all([loadKeys(), infoP]);
                    })
                    .catch((err) => {
                        appendTerminal(`切换数据库失败: ${err}`, 'error');
                        showToast('切换数据库失败: ' + err, 'error');
                    })
                    .finally(() => {
                        refreshDbSelector();
                    });
            }

            // ---------- 渲染：连接列表 ----------
            function renderConnections() {
                if (!CONNECTIONS || CONNECTIONS.length === 0) {
                    connectionListEl.innerHTML = `
                        <div style="padding:20px 12px;color:var(--text-muted);text-align:center;font-size:13px;">
                            <i class="fas fa-plug" style="display:block;font-size:22px;margin-bottom:8px;opacity:.4;"></i>
                            暂无连接<br/>点击右上角「新建连接」
                        </div>`;
                    return;
                }
                connectionListEl.innerHTML = CONNECTIONS.map(conn => {
                    const isActive = currentConn && conn.id === currentConn.id;
                    const isOnline = onlineConns.has(conn.id);
                    return `
                    <div class="connection-item ${isActive ? 'active' : ''}" data-id="${conn.id}">
                        <div class="info">
                            <div class="name">${conn.name}</div>
                            <div class="host">${conn.host}:${conn.port}</div>
                        </div>
                        <span class="badge ${isOnline ? 'online' : ''}">${isOnline ? '● 在线' : '○ 离线'}</span>
                        <div class="dropdown-container">
                            <div class="actions">
                                <button class="icon-btn refresh-conn" data-id="${conn.id}" title="刷新"><i class="fas fa-sync-alt"></i></button>
                                <button class="icon-btn conn-menu-btn" data-id="${conn.id}" title="更多操作"><i class="fas fa-ellipsis-v"></i></button>
                            </div>
                            <div class="conn-dropdown-menu" data-id="${conn.id}">
                                <button class="dd-item" data-action="edit"><i class="fas fa-pen"></i>编辑</button>
                                <button class="dd-item" data-action="duplicate"><i class="fas fa-copy"></i>复制</button>
                                <button class="dd-item" data-action="disconnect" ${isOnline ? '' : 'disabled'} style="${isOnline ? '' : 'opacity:.4;cursor:not-allowed;'}"><i class="fas fa-plug"></i>关闭连接</button>
                                <button class="dd-item" data-action="delete"><i class="fas fa-trash-alt"></i>删除</button>
                            </div>
                        </div>
                    </div>`;
                }).join('');

                // 事件绑定
                connectionListEl.querySelectorAll('.connection-item').forEach(el => {
                    el.addEventListener('click', (e) => {
                        if (e.target.closest('.actions')) return;
                        const id = el.dataset.id;
                        const conn = CONNECTIONS.find(c => c.id === id);
                        if (conn) switchConnection(conn);
                    });
                });
                // 刷新图标
                connectionListEl.querySelectorAll('.refresh-conn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        const conn = CONNECTIONS.find(c => c.id === id);
                        if (conn) switchConnection(conn);
                    });
                });
                // 菜单按钮：点击切换下拉
                connectionListEl.querySelectorAll('.conn-menu-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        // 关闭其他下拉
                        document.querySelectorAll('.conn-dropdown-menu.show').forEach(m => {
                            if (m.dataset.id !== id) m.classList.remove('show');
                        });
                        const menu = connectionListEl.querySelector(`.conn-dropdown-menu[data-id="${id}"]`);
                        if (menu) menu.classList.toggle('show');
                    });
                });
                // 下拉菜单按钮
                connectionListEl.querySelectorAll('.conn-dropdown-menu .dd-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const menu = item.closest('.conn-dropdown-menu');
                        if (menu) menu.classList.remove('show');
                        const id = item.closest('.conn-dropdown-menu').dataset.id;
                        const conn = CONNECTIONS.find(c => c.id === id);
                        const action = item.dataset.action;
                        if (!conn) return;
                        if (action === 'edit') {
                            openModal(conn);
                        } else if (action === 'duplicate') {
                            openModal(null);
                            document.getElementById('connName').value = conn.name + ' 副本';
                            if (conn.host) document.getElementById('connHost').value = conn.host;
                            if (conn.port) document.getElementById('connPort').value = conn.port;
                            if (conn.username) document.getElementById('connUser').value = conn.username;
                            if (conn.password) document.getElementById('connPass').value = conn.password;
                            if (conn.readonly) document.getElementById('connReadonly').checked = true;
                            if (conn.type === 'cluster') document.getElementById('connCluster').checked = true;
                            if (conn.separator) document.getElementById('connSeparator').value = conn.separator;
                            document.getElementById('connName').focus();
                        } else if (action === 'disconnect') {
                            if (!onlineConns.has(id)) return; // 已离线，忽略
                            invoke('disconnect', { connId: id }).then(() => {
                                onlineConns.delete(id);
                                if (currentConn && currentConn.id === id) {
                                    currentConn.online = false;
                                    renderKeyTree();
                                    renderDetail();
                                }
                                renderConnections();
                                updateStatus();
                                refreshDbSelector();
                                appendTerminal(`已关闭连接 ${conn.name}`, '');
                            }).catch(err => {
                                showToast('关闭连接失败: ' + err, 'error');
                            });
                        } else if (action === 'delete') {
                            showConfirm(`确定要删除连接「${conn.name}」吗？`, { title: '删除连接' }).then((ok) => {
                                if (!ok) return;
                                invoke('delete_connection', { connId: id }).then((deleted) => {
                                    if (deleted === false) {
                                        showToast('未找到该连接，可能已被删除', 'error');
                                    }
                                    onlineConns.delete(id);
                                    if (currentConn && currentConn.id === id) {
                                        currentConn = null;
                                    }
                                    return loadConnections();
                                }).catch(err => {
                                    showToast('删除失败: ' + err, 'error');
                                });
                            });
                        }
                    });
                });
                // 点击空白处关闭下拉
                if (!window._connMenuListener) {
                    window._connMenuListener = true;
                    document.addEventListener('click', () => {
                        document.querySelectorAll('.conn-dropdown-menu.show').forEach(m => m.classList.remove('show'));
                    });
                }
            }

            function connectTo(conn) {
                if (!conn) return Promise.reject(new Error('无连接信息'));
                appendTerminal(`正在连接 ${conn.name} (${conn.host}:${conn.port}) …`, '');
                // 直接建立连接（connect 内部会替换连接池中同 id 的连接）
                return invoke('connect', {
                    conn: {
                        id: conn.id,
                        name: conn.name,
                        host: conn.host,
                        port: conn.port,
                        type: conn.type || 'single',
                        readonly: !!conn.readonly,
                        separator: conn.separator || ':',
                        db: (conn.db !== undefined && conn.db !== null) ? conn.db : 0,
                        username: conn.username || null,
                        password: conn.password || null,
                    }
                }).then(() => {
                    if (conn && conn.id) onlineConns.add(conn.id);
                    currentConn = { ...conn, online: true };
                    return invoke('get_server_info', { connId: conn.id });
                }).then((info) => {
                    currentConn.info = info;
                    return info;
                });
            }

            function switchConnection(conn) {
                if (!conn) return;
                // 初始化逻辑数据库编号（旧连接配置可能没有 db 字段）
                if (conn.db === undefined || conn.db === null) conn.db = 0;
                currentConn = conn;
                renderConnections();
                updateStatus();
                renderKeyTree();
                renderDetail();
                refreshDbSelector();
                connectTo(conn).then((info) => {
                    if (info) {
                        renderServerInfo(info);
                        // 更新连接状态为「已连接」并刷新底栏和左侧徽章
                        currentConn.online = true;
                        onlineConns.add(conn.id);
                        renderConnections();
                        updateStatus();
                        refreshDbSelector();
                        const mem = info.usedMemory ? formatAppBytes(Number(info.usedMemory)) : '-';
                        const days = info.uptimeSeconds > 0 ? Math.floor(info.uptimeSeconds / 86400) : 0;
                        const hrs = info.uptimeSeconds > 0 ? Math.floor((info.uptimeSeconds % 86400) / 3600) : 0;
                        appendTerminal(
                            `连接成功 · Redis ${info.redisVersion || ''} · 运行 ${days}天${hrs}时 · 内存 ${mem} · 连接 ${info.connectedClients || 0} · Keys ${info.dbKeys || 0}`,
                            'ok'
                        );
                        // 连接成功后加载真实 key 列表
                        loadKeys();
                    }
                }).catch(err => {
                    if (currentConn) {
                        currentConn.online = false;
                        onlineConns.delete(currentConn.id);
                    }
                    renderConnections();
                    updateStatus();
                    appendTerminal(`连接失败: ${err}`, 'error');
                    showToast('连接失败: ' + err, 'error');
                });
            }

            function renderServerInfo(info) {
                if (!info) return;
                const setStat = (id, txt) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = txt;
                };

                // Key 总数
                const keys = info.dbKeys !== undefined ? Number(info.dbKeys).toLocaleString() : '-';
                setStat('statKeys', keys);

                // 磁盘空间使用率（Redis 持久化数据所在磁盘）
                const diskEl = document.getElementById('statDisk');
                const diskWrap = document.getElementById('statDiskItem');
                if (info.disk && info.disk.usedPercent !== undefined && info.disk.usedPercent !== null) {
                    const pct = formatDiskPercent(info.disk.usedPercent);
                    setStat('statDisk', pct);
                    if (diskWrap) {
                        diskWrap.title = info.disk.path
                            ? `Redis 持久化目录: ${info.disk.path} · 磁盘已用 ${pct}`
                            : '磁盘已用 ' + pct;
                        diskWrap.style.cursor = 'help';
                    }
                } else {
                    setStat('statDisk', '-');
                }

                // 内存（B → 可读大小）
                const mem = info.usedMemory !== undefined ? formatAppBytes(Number(info.usedMemory)) : '-';
                setStat('statMem', mem);

                // 连接数
                setStat('statConn', info.connectedClients !== undefined ? String(info.connectedClients) : '-');
            }

            // 格式化为百分比（保留 1 位小数）
            function formatDiskPercent(p) {
                const n = Number(p);
                return (isFinite(n) ? Math.round(n * 10) / 10 : n) + '%';
            }

            function formatAppBytes(bytes) {
                if (!bytes) return '0B';
                const u = ['B','KB','MB','GB'];
                let i = 0, v = Number(bytes);
                while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
                return (i === 0 ? v : v.toFixed(1)) + u[i];
            }

            function updateStatus() {
                const online = currentConn && currentConn.online;
                statusDot.className = 'dot' + (online ? '' : ' disconnected');
                let suffix = '';
                if (online && currentConn.readonly) suffix = ' (只读)';
                statusLabel.textContent = online ?
                    `已连接 · ${currentConn.host}:${currentConn.port}${suffix}` :
                    `未连接 · ${currentConn ? currentConn.host : '无'}`;
                updateReadonlyUI();
            }

            // 根据当前连接是否为只读，启用/禁用写操作入口
            function updateReadonlyUI() {
                const readonly = !!(currentConn && currentConn.online && currentConn.readonly);
                const ids = ['btnAddKey', 'btnFlush', 'detailSave'];
                ids.forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) {
                        btn.disabled = readonly;
                        btn.title = readonly ? '只读连接，禁止写操作' : btn.getAttribute('data-orig-title') || '';
                        btn.style.cursor = readonly ? 'not-allowed' : '';
                    }
                });
            }

// 从后端加载 key 列表并刷新树
            function loadKeys() {
                if (!currentConn || !currentConn.id) return Promise.resolve();
                return invoke('list_keys', { connId: currentConn.id })
                    .then((list) => {
                        const items = list || [];
                        const flat = {};
                        const flatList = [];
                        for (const it of items) {
                            const ttl = it.ttl !== undefined ? it.ttl : -1;
                            flat[it.key] = { type: it.type || 'string', ttl, value: '' };
                            flatList.push({ key: it.key, type: it.type || 'string', ttl, value: '' });
                        }
                        KEY_DATA = flat;
                        allKeys = flatList;
                        renderKeyTree(keySearch ? keySearch.value : '');
                        // 注意：不要用 allKeys.length 覆盖 statKeys。
                        // statKeys 表示「当前数据库的 key 总数（DBSIZE）」，由 renderServerInfo 维护，
                        // 与顶部 DB 选择器联动，是当前的实时数据。
                        return allKeys;
                    })
                    .catch(err => {
                        console.error('加载 Key 列表失败', err);
                        return [];
                    });
            }

            // ---------- 渲染：Key 列表（支持按分隔符折叠为文件夹） ----------
            // 每个连接已展开的文件夹路径集合，Map<connId, Set<folderPath>>
            let expandedCache = {};

            function sepCacheKey() {
                return (currentConn && currentConn.id) || 'default';
            }

            function getExpandedSet() {
                const k = sepCacheKey();
                if (!expandedCache[k]) expandedCache[k] = new Set();
                return expandedCache[k];
            }

            function getSeparator() {
                const sep = currentConn && currentConn.separator;
                return (typeof sep === 'string' && sep.length > 0) ? sep : ':';
            }

            // 渲染叶子 key 行
            function renderKeyRowHtml(key, depth) {
                const item = KEY_DATA[key] || {};
                const t = item.type || 'string';
                return '<div class="tree-node">' +
                    '<div class="node-label node-key-select' + (selectedKey === key ? ' active' : '') + '" data-key="' + escapeHtml(key) + '" title="' + escapeHtml(key) + '" style="padding-left:' + (8 + depth * 16) + 'px">' +
                        '<span class="toggle" style="visibility:hidden;"><i class="fas fa-chevron-right"></i></span>' +
                        '<i class="fas fa-key icon-key"></i>' +
                        '<span class="key-name">' + escapeHtml(key) + '</span>' +
                        '<span class="key-type ' + (item.type || 'string') + '">' + (item.type || 'string') + '</span>' +
                    '</div></div>';
            }

            // 渲染文件夹行
            function renderFolderRowHtml(label, path, isOpen, depth) {
                return '<div class="tree-node"><div class="node-label node-folder-select' + (isOpen ? ' open' : '') + '" data-folder="' + escapeHtml(path) + '" style="padding-left:' + (8 + depth * 16) + 'px">' +
                    '<span class="toggle"><i class="fas fa-chevron-right' + (isOpen ? ' open' : '') + '"></i></span>' +
                    '<i class="fas fa-folder' + (isOpen ? '-open' : '') + ' icon-folder"></i>' +
                    '<span class="key-name">' + escapeHtml(label) + '</span>' +
                '</div></div>';
            }

            // 文件夹模式：keys 已过滤排序。按 sep 组织成目录树并递归渲染。
            function renderFolders(keys, sep, expanded, depth, dirPath) {
                const prefix = dirPath ? dirPath + sep : '';
                const childDirs = new Set();
                const leafKeys = [];
                keys.forEach(function (k) {
                    if (!k.startsWith(prefix)) return;
                    const rest = k.slice(prefix.length);
                    if (rest === '') return;
                    const idx = rest.indexOf(sep);
                    if (idx === -1) {
                        leafKeys.push(k); // 直接子 key（完整路径）
                    } else {
                        childDirs.add(prefix + rest.slice(0, idx)); // 直接子目录
                    }
                });
                let html = '';
                // 先文件件（按路径），再 key
                const dirList = Array.from(childDirs).sort();
                for (let i = 0; i < dirList.length; i++) {
                    const d = dirList[i];
                    const label = d.split(sep).pop();
                    const isOpen = expanded.has(d);
                    html += renderFolderRowHtml(label, d, isOpen, depth);
                    if (isOpen) {
                        html += renderFolders(keys, sep, expanded, depth + 1, d);
                    }
                }
                const leafList = leafKeys.sort();
                for (let j = 0; j < leafList.length; j++) {
                    html += renderKeyRowHtml(leafList[j], depth);
                }
                return html;
            }

            // 渲染 Key 列表（文件夹折叠模式）
            function renderKeyTree(filter = '') {
                const searchTerm = (filter || '').trim().toLowerCase();
                const isConnected = currentConn && currentConn.online;

                if (!isConnected) {
                    keyTreeEl.innerHTML = '' +
                        '<div style="padding:24px 16px;color:var(--text-muted);text-align:center;font-size:13px;">' +
                            '<i class="fas fa-plug" style="font-size:22px;display:block;margin-bottom:8px;opacity:.4;"></i>' +
                            '请先连接 Redis 服务器' +
                        '</div>';
                    return;
                }

                let list = Object.keys(KEY_DATA);
                if (searchTerm) list = list.filter(k => k.toLowerCase().includes(searchTerm));
                list = list.sort((a, b) => a.localeCompare(b));

                if (list.length === 0) {
                    keyTreeEl.innerHTML = '' +
                        '<div style="padding:24px 16px;color:var(--text-muted);text-align:center;font-size:13px;">' +
                            '<i class="fas fa-inbox" style="font-size:22px;display:block;margin-bottom:8px;opacity:.4;"></i>' +
                            (searchTerm ? '没有匹配的 Key' : '暂无 Key\n点击「新增 Key」创建') +
                        '</div>';
                    return;
                }

                const sep = getSeparator();
                const folderMode = !searchTerm && !!sep; // 搜索时不折叠文件夹
                const expanded = getExpandedSet();

                let html;
                if (folderMode) {
                    html = renderFolders(list, sep, expanded, 0, '');
                } else {
                    html = list.map(k => renderKeyRowHtml(k, 0)).join('');
                }
                keyTreeEl.innerHTML = html;

                keyTreeEl.querySelectorAll('.node-key-select').forEach(el => {
                    el.addEventListener('click', () => {
                        selectedKey = el.dataset.key;
                        renderKeyTree(keySearch.value);
                        renderDetail();
                    });
                });
                keyTreeEl.querySelectorAll('.node-folder-select').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const p = el.dataset.folder;
                        const es = getExpandedSet();
                        if (es.has(p)) es.delete(p); else es.add(p);
                        renderKeyTree(keySearch.value);
                    });
                });
            }

            // ---------- 渲染：Key 详情 ----------
            function renderDetail() {
                if (!selectedKey) {
                    keyDetailEl.innerHTML = `
                        <div class="empty-state">
                            <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="56" height="56"><defs><linearGradient id="md-favicon-gradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f9c75e" /><stop offset="100%" stop-color="#f5b342" /></linearGradient></defs><ellipse cx="44" cy="28" rx="24" ry="9" fill="url(#md-favicon-gradient)" /><path d="M20 28 L20 70 Q20 78 44 78 Q68 78 68 70 L68 28" fill="url(#md-favicon-gradient)" /><circle cx="72" cy="72" r="20" fill="#ffffff" stroke="#f5b342" stroke-width="4" /><text x="72" y="78" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" font-size="15" fill="#f5b342">MR</text></svg>
                            <h3>选择一个 Key</h3>
                            <p>从左侧树中点击任意 Key 查看详细内容和值</p>
                        </div>
                    `;
                    return;
                }
                const item = allKeys.find(k => k.key === selectedKey);
                if (!item) {
                    keyDetailEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>Key 不存在</h3>
                            <p>该 Key 可能已被删除或不存在</p>
                        </div>
                    `;
                    return;
                }

                const typeClass = item.type || 'string';
                const typeLabel = typeClass.toUpperCase();
                const ttl = item.ttl !== undefined ? item.ttl : -1;
                // 只读连接（已连接且配置为只读）时，禁用「保存」按钮
                const readonlyConn = !!(currentConn && currentConn.online && currentConn.readonly);

                const valueActions = buildValueEditorActions(typeClass);

                let valueHtml = '';
                if (typeClass === 'string') {
                    valueHtml = `
                        <textarea id="valueEditor" placeholder="加载中…">${escapeHtml(item.value || '')}</textarea>
                    `;
                    // 从后端拉取真实值（异步）
                    if (currentConn && currentConn.id) {
                        const thisKey = selectedKey;
                        invoke('get_string', { connId: currentConn.id, key: thisKey })
                            .then(v => {
                                if (v === null || v === undefined) {
                                    v = '(nil)';
                                }
                                const editor = document.getElementById('valueEditor');
                                if (editor && selectedKey === thisKey) {
                                    editor.value = v;
                                }
                            })
                            .catch(() => { /* 忽略 */ });
                    }
                } else if (typeClass === 'hash') {
                    const obj = item.value || {};
                    const fields = Object.entries(obj);
                    valueHtml = `
                        <div class="hash-view">
                            ${fields.map(([k, v]) => `
                                <div class="field">
                                    <span class="fkey">${k}</span>
                                    <span class="fval">${v}</span>
                                </div>
                            `).join('')}
                            ${fields.length === 0 ? '<div style="color:var(--text-muted);grid-column:1/3;text-align:center;padding:12px;">空 Hash</div>' : ''}
                        </div>
                    `;
                } else if (typeClass === 'list') {
                    const arr = item.value || [];
                    valueHtml = `
                        <div class="list-view">
                            ${arr.map((v, i) => `
                                <div class="item">
                                    <span class="idx">${i}</span>
                                    <span class="val">${v}</span>
                                </div>
                            `).join('')}
                            ${arr.length === 0 ? '<div style="color:var(--text-muted);text-align:center;padding:12px;">空 List</div>' : ''}
                        </div>
                    `;
                } else if (typeClass === 'set') {
                    const arr = item.value || [];
                    valueHtml = `
                        <div class="list-view">
                            ${arr.map((v, i) => `
                                <div class="item">
                                    <span class="idx">${i + 1}</span>
                                    <span class="val">${v}</span>
                                </div>
                            `).join('')}
                            ${arr.length === 0 ? '<div style="color:var(--text-muted);text-align:center;padding:12px;">空 Set</div>' : ''}
                        </div>
                    `;
                } else {
                    valueHtml = `
                        <div style="color:var(--text-muted);padding:12px;">暂不支持此类型</div>
                    `;
                }

                const ttlDisplay = ttl === -1 ? '永不过期' : `${ttl}s`;
                const ttlDisabled = readonlyConn ? ' disabled' : '';

                keyDetailEl.innerHTML = `
                    <div class="detail-header">
                        <div class="key-title">
                            <span>${selectedKey}</span>
                            <span class="type-badge ${typeClass}">${typeLabel}</span>
                        </div>
                        <span class="ttl"><i class="far fa-clock"></i> <input type="number" id="detailTtl" value="${ttl}" title="TTL（秒），-1 表示永不过期"${ttlDisabled} /></span>
                        <div class="detail-actions">
                            <button class="primary" id="detailSave"${readonlyConn ? ' disabled' : ''} data-orig-title="保存修改" title="${readonlyConn ? '只读连接，禁止写操作' : '保存修改'}"><i class="fas fa-save"></i> 保存</button>
                            <button id="detailRefresh"><i class="fas fa-sync-alt"></i> 刷新</button>
                            <button class="danger" id="detailDelete"><i class="fas fa-trash-alt"></i> 删除</button>
                        </div>
                    </div>
                    <div class="detail-body">
                        <div class="value-editor">
                            <div class="editor-toolbar">
                                ${valueActions}
                            </div>
                            ${valueHtml}
                        </div>
                        <div class="value-footer">
                            <div class="info">
                                <span><i class="far fa-file"></i> 类型: ${typeLabel}</span>
                                <span><i class="far fa-clock"></i> TTL: ${ttlDisplay}</span>
                            </div>
                            <span>大小: ${item.value ? JSON.stringify(item.value).length : 0} 字节</span>
                        </div>
                    </div>
                `;

                const saveBtn = document.getElementById('detailSave');
                if (saveBtn) {
                    saveBtn.addEventListener('click', () => {
                        if (!currentConn || !currentConn.id) {
                            showToast('请先连接 Redis 服务器', 'error');
                            return;
                        }
                        if (currentConn.readonly) {
                            showToast('只读连接，禁止写操作', 'error');
                            appendTerminal(`保存 Key "${selectedKey}" 失败: 当前为只读连接，禁止写操作`, 'error');
                            return;
                        }
                        const editor = document.getElementById('valueEditor');
                        if (!editor) {
                            showToast('此类型不支持直接修改', 'info');
                            return;
                        }
                        const value = editor.value;
                        const ttlInput = document.getElementById('detailTtl');
                        const ttlResult = parseTtl(ttlInput ? ttlInput.value : '-1');
                        if (!ttlResult.ok) {
                            showToast(ttlResult.message, 'error');
                            if (ttlInput) ttlInput.focus();
                            return;
                        }
                        saveBtn.disabled = true;
                        invoke('set_key', { connId: currentConn.id, key: selectedKey, value: value, ttl: ttlResult.ttl })
                            .then(() => {
                                const ttlArg = ttlResult.ttl > 0 ? ` EX ${ttlResult.ttl}` : '';
                                appendTerminal(`SET ${selectedKey}${ttlArg} → OK`, 'ok');
                                showToast('Key 已保存', 'success');
                                if (KEY_DATA[selectedKey]) {
                                    KEY_DATA[selectedKey].value = value;
                                    KEY_DATA[selectedKey].ttl = ttlResult.ttl;
                                }
                                loadKeys().then(() => renderDetail());
                            })
                            .catch(err => {
                                showToast('保存失败: ' + err, 'error');
                                appendTerminal(`保存 Key "${selectedKey}" 失败: ${err}`, 'error');
                            })
                            .finally(() => {
                                saveBtn.disabled = false;
                            });
                    });
                }
                const refreshBtn = document.getElementById('detailRefresh');
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', () => {
                        renderDetail();
                        appendTerminal(`刷新 Key "${selectedKey}"`, '');
                    });
                }
                const deleteBtn = document.getElementById('detailDelete');
                if (deleteBtn) {
                    deleteBtn.addEventListener('click', () => {
                        const keyToDelete = selectedKey;
                        if (!keyToDelete) return;
                        showConfirm(`确定要删除 Key「${keyToDelete}」吗？此操作不可恢复。`, { title: '删除 Key' }).then((ok) => {
                            if (!ok) return;
                            if (!currentConn || !currentConn.id) {
                                showToast('未连接到 Redis', 'error');
                                return;
                            }
                            invoke('del_key', { connId: currentConn.id, keys: [keyToDelete] })
                                .then((n) => {
                                    appendTerminal(`删除 Key "${keyToDelete}"${n > 0 ? '' : '（不存在）'}`, n > 0 ? 'ok' : '');
                                    showToast(n > 0 ? 'Key 已删除' : 'Key 不存在', n > 0 ? 'success' : 'error');
                                    if (selectedKey === keyToDelete) selectedKey = null;
                                    // 刷新 key 列表
                                    return loadKeys();
                                })
                                .catch(err => {
                                    console.error('删除 Key 失败', err);
                                    showToast('删除 Key 失败: ' + err, 'error');
                                });
                        });
                    });
                }

                // 获取当前详情展示的文本值（string 取编辑器内容，其它类型取序列化结果）
                const currentDetailValue = () => {
                    const editor = document.getElementById('valueEditor');
                    if (editor) return editor.value;
                    return item.value != null ? JSON.stringify(item.value, null, 2) : '';
                };

                const formatBtn = document.getElementById('editorFormat');
                if (formatBtn) {
                    formatBtn.addEventListener('click', () => {
                        const editor = document.getElementById('valueEditor');
                        if (!editor) return;
                        const formatted = formatJsonText(editor.value);
                        editor.value = formatted;
                        appendTerminal(`格式化 Key "${selectedKey}" 的值`, 'ok');
                        showToast('已格式化', 'success');
                    });
                }

                const copyBtn = document.getElementById('editorCopy');
                if (copyBtn) {
                    copyBtn.addEventListener('click', () => {
                        const text = currentDetailValue();
                        const done = () => { showToast('已复制到剪贴板', 'success'); };
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
                        } else {
                            fallbackCopy(text, done);
                        }
                    });
                }
            }

            // ---------- 终端 ----------
            function appendTerminal(text, type = '') {
                const line = document.createElement('div');
                line.className = 'line';
                const cls = type === 'ok' ? 'output ok' : type === 'error' ? 'output error' : 'output';
                line.innerHTML = `<span class="prompt">></span><span class="${cls}">${text}</span>`;
                terminalBody.appendChild(line);
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }

            function executeCommand(cmd) {
                const trimmed = cmd.trim();
                if (!trimmed) return;
                appendTerminal(trimmed, '');
                const lower = trimmed.toLowerCase();
                if (lower === 'ping') {
                    appendTerminal('PONG', 'ok');
                } else if (lower === 'info') {
                    appendTerminal('# Server\nredis_version: 7.2.4\nuptime: 3 days\nconnected_clients: 12', '');
                } else if (lower === 'dbsize') {
                    appendTerminal(`(integer) ${allKeys.length}`, 'ok');
                } else if (lower.startsWith('get ')) {
                    const key = trimmed.slice(4).trim();
                    const found = allKeys.find(k => k.key === key);
                    if (found && found.type === 'string') {
                        appendTerminal(found.value || '(nil)', 'ok');
                    } else {
                        appendTerminal('(nil)', '');
                    }
                } else if (lower.startsWith('set ')) {
                    const parts = trimmed.slice(4).trim().split(' ');
                    if (parts.length >= 2) {
                        appendTerminal('OK', 'ok');
                    } else {
                        appendTerminal('ERR wrong number of arguments', 'error');
                    }
                } else if (lower.startsWith('keys ')) {
                    const pattern = trimmed.slice(5).trim();
                    const matched = allKeys.filter(k => {
                        if (pattern === '*') return true;
                        const regex = new RegExp('^' + pattern.replace(/\*/g, '.*') + '$');
                        return regex.test(k.key);
                    });
                    appendTerminal(matched.map(k => k.key).join('\n') || '(empty array)', '');
                } else if (lower === 'flushdb') {
                    appendTerminal('OK (模拟清空)', 'ok');
                } else if (lower === 'help') {
                    appendTerminal('支持命令: PING, INFO, DBSIZE, GET key, SET key value, KEYS pattern, FLUSHDB, HELP', '');
                } else {
                    appendTerminal(`ERR 未知命令或模拟未实现: "${trimmed}"`, 'error');
                }
                terminalInput.value = '';
                terminalInput.focus();
            }

            // ---------- 模态框 ----------
            let editingConnId = null;

            function openModal(conn = null) {
                if (conn) {
                    editingConnId = conn.id;
                    modalTitle.textContent = '编辑连接';
                    document.getElementById('connName').value = conn.name;
                    document.getElementById('connHost').value = conn.host;
                    document.getElementById('connPort').value = conn.port;
                    document.getElementById('connUser').value = conn.username || '';
                    document.getElementById('connPass').value = conn.password || '';
                    document.getElementById('connReadonly').checked = !!conn.readonly;
                    document.getElementById('connCluster').checked = conn.type === 'cluster';
                    document.getElementById('connSeparator').value = conn.separator || '';
                } else {
                    editingConnId = null;
                    modalTitle.textContent = '新建连接';
                    document.getElementById('connName').value = '';
                    document.getElementById('connHost').value = '127.0.0.1';
                    document.getElementById('connPort').value = '6379';
                    document.getElementById('connUser').value = '';
                    document.getElementById('connPass').value = '';
                    document.getElementById('connReadonly').checked = false;
                    document.getElementById('connCluster').checked = false;
                    document.getElementById('connSeparator').value = '';
                }
                showTestStatus('', '');
                modal.classList.add('open');
                document.getElementById('connName').focus();
            }

            function closeModal() {
                modal.classList.remove('open');
                showTestStatus('', '');
            }

            // ---------- 通用确认对话框（替代原生 confirm） ----------
            let _confirmResolve = null;
            function showConfirm(message, options = {}) {
                const cModal = document.getElementById('confirmModal');
                document.getElementById('confirmTitle').textContent = options.title || '提示';
                document.getElementById('confirmMessage').textContent = message;
                const okBtn = document.getElementById('confirmOk');
                okBtn.textContent = options.okText || '删除';
                if (options.danger !== false) {
                    okBtn.style.background = 'var(--danger, #e5484d)';
                    okBtn.style.borderColor = 'var(--danger, #e5484d)';
                } else {
                    okBtn.style.background = '';
                    okBtn.style.borderColor = '';
                }
                cModal.classList.add('open');
                return new Promise((resolve) => {
                    _confirmResolve = resolve;
                });
            }
            function closeConfirm(result) {
                const cModal = document.getElementById('confirmModal');
                cModal.classList.remove('open');
                if (_confirmResolve) {
                    _confirmResolve(result);
                    _confirmResolve = null;
                }
            }
            // 确认框事件绑定
            document.getElementById('confirmOk').addEventListener('click', () => closeConfirm(true));
            document.getElementById('confirmCancel').addEventListener('click', () => closeConfirm(false));
            document.getElementById('confirmModal').addEventListener('click', (e) => {
                if (e.target.id === 'confirmModal') closeConfirm(false);
            });

            function saveConnection() {
                const name = document.getElementById('connName').value.trim();
                const host = document.getElementById('connHost').value.trim();
                const port = parseInt(document.getElementById('connPort').value) || 6379;
                if (!name || !host) {
                    showToast('请填写名称和主机', 'error');
                    return;
                }
                const id = editingConnId || ('conn_' + Date.now());
                let separator = document.getElementById('connSeparator').value;
                const conn = {
                    id: id,
                    name: name,
                    host: host,
                    port: port,
                    type: document.getElementById('connCluster').checked ? 'cluster' : 'single',
                    readonly: document.getElementById('connReadonly').checked,
                    separator: separator || ':',
                    username: document.getElementById('connUser').value || null,
                    password: document.getElementById('connPass').value || null,
                };
                invoke('save_connection', { conn }).then(() => {
                    closeModal();
                    showToast(editingConnId ? '连接已更新' : '连接已创建', 'success');
                    return loadConnections();
                }).then(() => {
                    if (currentConn) {
                        const updated = CONNECTIONS.find(c => c.id === currentConn.id);
                        if (updated) switchConnection(updated);
                    }
                }).catch(err => {
                    showToast('保存失败: ' + err, 'error');
                });
            }

            function showTestStatus(msg, type) {
                const el = document.getElementById('testStatus');
                el.textContent = msg;
                el.className = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
            }

            function testConnection() {
                const host = document.getElementById('connHost').value.trim();
                const port = parseInt(document.getElementById('connPort').value) || 0;
                if (!host || !port) {
                    showTestStatus('请填写主机和端口', 'error');
                    return;
                }

                const btn = document.getElementById('modalTest');
                const originalText = btn.textContent;
                btn.disabled = true;
                btn.textContent = '测试中…';
                showTestStatus('正在测试连接…', 'info');

                const conn = {
                    id: editingConnId || ('test_' + Date.now()),
                    name: document.getElementById('connName').value.trim() || '测试连接',
                    host: host,
                    port: port,
                    type: document.getElementById('connCluster').checked ? 'cluster' : 'single',
                    readonly: document.getElementById('connReadonly').checked,
                    separator: document.getElementById('connSeparator').value || ':',
                    username: document.getElementById('connUser').value || null,
                    password: document.getElementById('connPass').value || null,
                };

                invoke('test_connection', { conn })
                    .then(pong => {
                        showTestStatus('✓ 连接成功（' + pong + '）', 'success');
                    })
                    .catch(err => {
                        showTestStatus('✗ ' + err, 'error');
                    })
                    .finally(() => {
                        btn.disabled = false;
                        btn.textContent = originalText;
                    });
            }

            // ---------- Toast 提示 ----------
            function showToast(msg, type = 'info') {
                const existing = document.querySelector('.toast-notification');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast-notification';
                const colors = {
                    success: 'var(--green)',
                    error: 'var(--accent)',
                    info: 'var(--blue)',
                };
                toast.style.cssText = `
                    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
                    background: var(--bg-secondary); border: 1px solid var(--border-color);
                    padding: 10px 28px; border-radius: var(--radius);
                    font-size: 14px; color: var(--text-primary);
                    box-shadow: var(--shadow); z-index: 2000;
                    border-left: 4px solid ${colors[type] || colors.info};
                    animation: fadeIn 0.2s ease;
                    max-width: 90vw;
                `;
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 2200);
            }

            // ---------- 事件绑定 ----------
            let terminalCollapsed = false;
            document.getElementById('terminalToggle').addEventListener('click', () => {
                terminalCollapsed = !terminalCollapsed;
                terminalPanel.classList.toggle('collapsed', terminalCollapsed);
                termChevron.className = terminalCollapsed ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
            });
            termToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                terminalCollapsed = !terminalCollapsed;
                terminalPanel.classList.toggle('collapsed', terminalCollapsed);
                termChevron.className = terminalCollapsed ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
            });

            terminalSend.addEventListener('click', () => executeCommand(terminalInput.value));
            terminalInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') executeCommand(terminalInput.value);
            });
            document.getElementById('termClear').addEventListener('click', () => {
                terminalBody.innerHTML = `
                    <div class="line"><span class="prompt">></span><span class="output ok">终端已清空</span></div>
                `;
            });

            keySearch.addEventListener('input', (e) => {
                renderKeyTree(e.target.value);
            });

            // 数据库切换
            if (dbSelect) dbSelect.addEventListener('change', onDbChange);

            document.getElementById('addConnectionBtn').addEventListener('click', () => openModal(null));
            document.getElementById('btnNewConnection').addEventListener('click', () => openModal(null));

            document.getElementById('modalTest').addEventListener('click', testConnection);
            document.getElementById('modalCancel').addEventListener('click', closeModal);
            document.getElementById('modalSave').addEventListener('click', saveConnection);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            ['connName', 'connHost', 'connPort', 'connUser', 'connPass', 'connSeparator'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', () => showTestStatus('', ''));
            });
            document.getElementById('connReadonly').addEventListener('change', () => showTestStatus('', ''));
            document.getElementById('connCluster').addEventListener('change', () => showTestStatus('', ''));
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
                if (e.key === 'Enter' && modal.classList.contains('open')) saveConnection();
            });

            document.getElementById('btnRefresh').addEventListener('click', () => {
                renderKeyTree(keySearch.value);
                showToast('已刷新', 'info');
                appendTerminal('刷新 Key 列表', '');
            });

            const addKeyModal = document.getElementById('addKeyModal');
            const addKeyNameInput = document.getElementById('addKeyName');
            const addKeyValueInput = document.getElementById('addKeyValue');
            const addKeyTtlInput = document.getElementById('addKeyTtl');

            function openAddKeyModal() {
                if (!currentConn || !currentConn.id) {
                    showToast('请先连接 Redis 服务器', 'error');
                    return;
                }
                if (currentConn.online !== true) {
                    showToast('请先连接 Redis 服务器', 'error');
                    return;
                }
                addKeyNameInput.value = '';
                addKeyValueInput.value = '';
                addKeyTtlInput.value = '-1';
                addKeyModal.classList.add('open');
                setTimeout(() => addKeyNameInput.focus(), 50);
            }

            function closeAddKeyModal() {
                addKeyModal.classList.remove('open');
            }

            function parseTtl(value) {
                if (value === '' || value === null || value === undefined) {
                    return { ok: false, message: '请输入 TTL' };
                }
                const trimmed = String(value).trim();
                if (!/^-?\d+$/.test(trimmed)) {
                    return { ok: false, message: 'TTL 必须为整数' };
                }
                const n = parseInt(trimmed, 10);
                if (n === -1) {
                    return { ok: true, ttl: -1 };
                }
                if (n <= 0) {
                    return { ok: false, message: 'TTL 必须为 -1 或正整数' };
                }
                return { ok: true, ttl: n };
            }

            function submitAddKey() {
                const trimmed = addKeyNameInput.value.trim();
                if (!trimmed) {
                    showToast('请输入 Key 名称', 'error');
                    addKeyNameInput.focus();
                    return;
                }
                if (allKeys.some(k => k.key === trimmed)) {
                    showToast('Key 已存在', 'error');
                    return;
                }
                const ttlResult = parseTtl(addKeyTtlInput.value);
                if (!ttlResult.ok) {
                    showToast(ttlResult.message, 'error');
                    addKeyTtlInput.focus();
                    return;
                }
                const value = addKeyValueInput.value;
                document.getElementById('btnAddKey').disabled = true;
                invoke('set_key', { connId: currentConn.id, key: trimmed, value: value, ttl: ttlResult.ttl })
                    .then(() => {
                        closeAddKeyModal();
                        showToast(`Key "${trimmed}" 已创建`, 'success');
                        const ttlArg = ttlResult.ttl > 0 ? ` EX ${ttlResult.ttl}` : '';
                        appendTerminal(`SET ${trimmed} "${value}"${ttlArg} → OK`, 'ok');
                        // 刷新 key 列表
                        loadKeys().then(() => {
                            selectedKey = trimmed;
                            renderKeyTree(keySearch.value);
                            renderDetail();
                        });
                    })
                    .catch(err => {
                        showToast('创建失败: ' + err, 'error');
                        appendTerminal(`SET ${trimmed} 失败: ${err}`, 'error');
                    })
                    .finally(() => {
                        document.getElementById('btnAddKey').disabled = false;
                    });
            }

            document.getElementById('btnAddKey').addEventListener('click', openAddKeyModal);
            document.getElementById('addKeyCancel').addEventListener('click', closeAddKeyModal);
            document.getElementById('addKeySave').addEventListener('click', submitAddKey);
            addKeyNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAddKey(); });
            addKeyValueInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submitAddKey(); });
            addKeyTtlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAddKey(); });
            addKeyModal.addEventListener('click', (e) => { if (e.target === addKeyModal) closeAddKeyModal(); });

            document.getElementById('btnImport').addEventListener('click', () => {
                showToast('导入功能 (模拟)', 'info');
                appendTerminal('执行导入操作 (模拟)', '');
            });
            document.getElementById('btnExport').addEventListener('click', () => {
                showToast('导出功能 (模拟)', 'info');
                appendTerminal('执行导出操作 (模拟)', '');
            });

            // ---------- 初始化 ----------
            // ---------- 数据加载（从后端） ----------
            function loadConnections() {
                return invoke('list_connections').then(list => {
                    CONNECTIONS = (list || []).map(c => ({
                        id: c.id,
                        name: c.name,
                        host: c.host,
                        port: c.port,
                        type: c.type || 'single',
                        readonly: !!c.readonly,
                        separator: c.separator || ':',
                        username: c.username || '',
                        password: c.password || '',
                    }));
                    if (currentConn) {
                        const still = CONNECTIONS.find(c => c.id === currentConn.id);
                        if (!still) currentConn = null;
                    }
                    renderConnections();
                    updateStatus();
                    return CONNECTIONS;
                }).catch(err => {
                    console.error('加载连接失败', err);
                    showToast('加载连接失败: ' + err, 'error');
                });
            }

            // ---------- 初始化 ----------
            refreshDbSelector();
            renderConnections();
            renderKeyTree();
            renderDetail();
            loadConnections();
            updateStatus();

            setTimeout(() => {
                appendTerminal('欢迎使用 麦地缓存', 'ok');
                appendTerminal('输入 HELP 查看可用命令', '');
            }, 300);

            // 定时刷新服务器信息（仅当已连接时）
            setInterval(() => {
                if (currentConn && currentConn.id && currentConn.online) {
                    invoke('get_server_info', { connId: currentConn.id })
                        .then(renderServerInfo)
                        .catch(() => { /* 忽略轮询错误，下次重试 */ });
                }
            }, 5000);

            window.__app = { allKeys, KEY_DATA, expandedFolders, renderKeyTree, renderDetail };

            // ==================== 主题切换 ====================
            const THEME_KEY = 'mc_cache_theme';
            const themeBtn = document.getElementById('btnTheme');
            const themeMenu = document.getElementById('themeMenu');

            function applyTheme(name) {
                if (!name) name = 'autumn';
                document.documentElement.setAttribute('data-theme', name);
            }

            function updateThemeMenu(name) {
                if (!name) name = 'autumn';
                document.querySelectorAll('#themeMenu .theme-option').forEach(opt => {
                    opt.classList.toggle('active', opt.getAttribute('data-theme-value') === name);
                });
            }

            themeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                themeMenu.classList.toggle('open');
            });
            document.addEventListener('click', () => themeMenu.classList.remove('open'));

            themeMenu.addEventListener('click', (e) => {
                const opt = e.target.closest('.theme-option');
                if (!opt) return;
                let name = opt.getAttribute('data-theme-value') || 'autumn';
                applyTheme(name);
                localStorage.setItem(THEME_KEY, name);
                updateThemeMenu(name);
                themeMenu.classList.remove('open');
            });

            // 恢复用户上次选择的主题
            try {
                let saved = localStorage.getItem(THEME_KEY) || 'autumn';
                applyTheme(saved);
                updateThemeMenu(saved);
                document.documentElement.setAttribute('data-theme', saved);
            } catch (e) {}

        })();
    </script>

</body>
</html>
