<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>麦地缓存</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ========== 深秋（暗色金，默认） ========== */
        :root,
        [data-theme="autumn"] {
            --bg-primary: #0d0b08;
            --bg-secondary: #1a150e;
            --bg-tertiary: #261f16;
            --bg-hover: #33291e;
            --bg-active: #403528;
            --bg-input: #0d0b08;
            --border-color: #4a3a2a;
            --text-primary: #f5e6d3;
            --text-secondary: #c4a88a;
            --text-muted: #7a6550;
            --accent: #f5b342;          /* 金黄色主色 */
            --accent-hover: #d4902a;
            --accent-dim: rgba(245, 179, 66, 0.18);
            --green: #7cb84b;
            --blue: #6a9fd8;
            --yellow: #f5b342;
            --purple: #b392d0;
            --radius: 8px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            --sidebar-width: 270px;
            --tree-width: 320px;
            --terminal-height: 200px;
            --header-height: 52px;
            color-scheme: dark;
        }

        /* ========== 初秋（亮金色） ========== */
        [data-theme="golden"] {
            --bg-primary: #fdf8ee;
            --bg-secondary: #fffaf0;
            --bg-tertiary: #fdf1d7;
            --bg-hover: #f7e6c3;
            --bg-active: #f0d9a8;
            --bg-input: #fdf8ee;
            --border-color: #e5c98f;
            --text-primary: #3d2f14;
            --text-secondary: #6b5622;
            --text-muted: #a08a4e;
            --accent: #d99a1b;          /* 暖金主色 */
            --accent-hover: #b87f12;
            --accent-dim: rgba(217, 154, 27, 0.16);
            --green: #5f9e3a;
            --blue: #4c7fc0;
            --yellow: #d9a514;
            --purple: #9a6fc4;
            --radius: 8px;
            --shadow: 0 8px 32px rgba(140, 100, 30, 0.25);
            color-scheme: light;
        }

        /* ========== 春天（清新绿） ========== */
        [data-theme="spring"] {
            --bg-primary: #f2f8f1;
            --bg-secondary: #f9fcf8;
            --bg-tertiary: #e9f4e6;
            ﻿--bg-hover: #dcefd5;
            --bg-active: #cde6c4;
            --bg-input: #f9fcf8;
            --border-color: #b5d8ab;
            --text-primary: #1e3320;
            --text-secondary: #44664b;
            --text-muted: #7b9b80;
            --accent: #4caf50;          /* 春芽绿主色 */
            --accent-hover: #3d9440;
            --accent-dim: rgba(76, 175, 80, 0.15);
            --green: #4caf50;
            --blue: #66bb6a;
            --yellow: #d4a017;
            --purple: #9ccc65;
            --radius: 8px;
            --shadow: 0 8px 32px rgba(76, 130, 70, 0.18);
            color-scheme: light;
        }

        /* ========== 夏天（晴空蓝） ========== */
        [data-theme="summer"] {
            --bg-primary: #eef6fd;
            --bg-secondary: #f7fbff;
            --bg-tertiary: #e3f0fc;
            --bg-hover: #d0e6fa;
            --bg-active: #bcdbf8;
            --bg-input: #f4faff;
            --border-color: #a8cdec;
            --text-primary: #0f2b42;
            --text-secondary: #2f5f8a;
            --text-muted: #6f96b8;
            --accent: #22a6f2;          /* 夏日晴空蓝主色 */
            --accent-hover: #1687cc;
            --accent-dim: rgba(34, 166, 242, 0.15);
            --green: #2ecc9a;
            --blue: #22a6f2;
            --yellow: #ffc93c;
            --purple: #9b6cc4;
            --radius: 8px;
            --shadow: 0 8px 32px rgba(34, 110, 170, 0.16);
            color-scheme: light;
        }

        /* ========== 冬至：明亮模式 ========== */
        [data-theme="winter"] {
            --bg-primary: #f5f6fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f2f8;
            --bg-hover: #e7ebf5;
            --bg-active: #dbe2f0;
            --bg-input: #ffffff;
            --border-color: #d3d9e5;
            --text-primary: #1c2333;
            --text-secondary: #455069;
            --text-muted: #8a93a6;
            --accent: #2563eb;          /* 冬日晴空蓝 */
            --accent-hover: #1d4fd8;
            --accent-dim: rgba(37, 99, 235, 0.12);
            --green: #2f9e5f;
            --blue: #3b82f6;
            --yellow: #d99a14;
            --purple: #8b5cf6;
            --radius: 8px;
            --shadow: 0 8px 32px rgba(31, 41, 72, 0.14);
            color-scheme: light;
        }

        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-window {
            width: 100vw;
            height: 100vh;
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ========== 标题栏 ========== */
        .titlebar {
            height: var(--header-height);
            min-height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 16px;
            user-select: none;
            flex-shrink: 0;
        }
        .titlebar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 17px;
            color: var(--text-primary);
        }
        .titlebar .logo i {
            color: var(--accent);
            font-size: 22px;
            text-shadow: 0 0 8px rgba(245, 179, 66, 0.3);
        }
        .titlebar .logo .logo-mark {
            width: 26px;
            height: 26px;
            display: block;
            filter: drop-shadow(0 0 6px rgba(245, 179, 66, 0.25));
        }
        .titlebar .logo span {
            background: var(--accent-dim);
            color: var(--accent);
            font-size: 10px;
            font-weight: 700;
            padding: 0 10px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(245, 179, 66, 0.2);
        }
        .titlebar .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .titlebar .connection-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        .titlebar .connection-status .dot.disconnected {
            background: var(--text-muted);
            animation: none;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .titlebar .spacer {
            flex: 1;
        }
        .titlebar .actions {
            display: flex;
            gap: 6px;
        }
        .titlebar .actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .titlebar .actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .titlebar .actions button.primary {
            background: var(--accent);
            color: #1a150e;
            width: auto;
            padding: 0 18px;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
        }
        .titlebar .actions button.primary:hover {
            background: var(--accent-hover);
            color: #0d0b08;
        }
        .titlebar .window-controls {
            display: flex;
            gap: 4px;
            margin-left: 12px;
        }
        .titlebar .window-controls span {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: block;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .titlebar .window-controls span:hover {
            opacity: 0.7;
        }
        .titlebar .window-controls .close { background: #ff5f57; }
        .titlebar .window-controls .min { background: #ffbd2e; }
        .titlebar .window-controls .max { background: #28c840; }

        /* ========== 主题切换下拉 ========== */
        .theme-dropdown {
            position: relative;
            margin-right: 8px;
        }
        .theme-dropdown .ghost-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 34px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .theme-dropdown .ghost-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--accent);
        }
        .theme-dropdown .theme-menu {
            position: absolute;
            top: calc(var(--header-height) - 12px);
            right: 0;
            min-width: 150px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 6px;
            z-index: 1000;
            display: none;
            flex-direction: column;
            gap: 2px;
        }
        .theme-dropdown .theme-menu.open { display: flex; }
        .theme-dropdown .theme-menu-title {
            font-size: 11px;
            color: var(--text-muted);
            padding: 4px 8px 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .theme-dropdown .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }
        .theme-dropdown .theme-option:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .theme-dropdown .theme-option.active {
            background: var(--accent-dim);
            color: var(--accent);
            font-weight: 600;
        }
        .theme-dropdown .theme-swatch {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            display: inline-block;
        }

        /* ========== 主体布局 ========== */
        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ========== 左侧边栏 ========== */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }
        .sidebar .section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 14px 16px 8px;
        }
        .connection-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 8px;
        }
        .connection-list::-webkit-scrollbar {
            width: 4px;
        }
        .connection-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        .connection-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }
        .connection-item:hover {
            background: var(--bg-hover);
        }
        .connection-item.active {
            background: var(--bg-active);
            border-left: 3px solid var(--accent);
        }
        .connection-item .icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--accent);
            flex-shrink: 0;
        }
        .connection-item .info {
            flex: 1;
            min-width: 0;
        }
        .connection-item .info .name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .connection-item .info .host {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .connection-item .badge {
            font-size: 10px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            padding: 1px 8px;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .connection-item .badge.online {
            background: rgba(124, 184, 75, 0.2);
            color: var(--green);
        }
        .connection-item .actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .connection-item .dropdown-container .actions {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .connection-item:hover .dropdown-container .actions {
            opacity: 1;
        }
        .connection-item .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
        }
        .connection-item .icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .dropdown-container {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .conn-dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            min-width: 130px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: var(--shadow);
            padding: 4px;
            z-index: 1000;
            display: none;
        }
        .conn-dropdown-menu.show {
            display: block;
        }
        .conn-dropdown-menu .dd-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 7px 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            text-align: left;
            white-space: nowrap;
        }
        .conn-dropdown-menu .dd-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .conn-dropdown-menu .dd-item.danger {
            color: #e06c75;
        }
        .conn-dropdown-menu .dd-item.danger:hover {
            background: rgba(224, 108, 117, 0.12);
            color: #e06c75;
        }

        .add-connection {
            margin: 0 12px 12px;
            padding: 8px;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius);
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .add-connection:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            flex-shrink: 0;
        }
        .db-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .db-selector label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .db-selector select {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
            flex: 1;
        }
        .db-selector select:focus {
            border-color: var(--accent);
        }
        .server-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .server-stats .stat-item {
            display: flex;
            justify-content: space-between;
        }
        .server-stats .stat-item .val {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* ========== 主内容区 ========== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-primary);
        }

        .toolbar {
            height: 44px;
            min-height: 44px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            flex-shrink: 0;
        }
        .toolbar .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0 10px;
            transition: border 0.2s;
            max-width: 400px;
        }
        .toolbar .search-box:focus-within {
            border-color: var(--accent);
        }
        .toolbar .search-box i {
            color: var(--text-muted);
            font-size: 13px;
        }
        .toolbar .search-box input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 6px 10px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        .toolbar .search-box input::placeholder {
            color: var(--text-muted);
        }
        .toolbar .search-box .sep-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-secondary);
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            margin-right: 4px;
            white-space: nowrap;
        }
        .toolbar .search-box .sep-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }
        .toolbar .search-box .sep-btn code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-weight: 700;
            color: var(--accent);
            font-size: 13px;
        }
        .toolbar .toolbar-actions {
            display: flex;
            gap: 4px;
        }
        .toolbar .toolbar-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }
        .toolbar .toolbar-actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .toolbar .toolbar-actions button.primary {
            background: var(--accent);
            color: #1a150e;
        }
        .toolbar .toolbar-actions button.primary:hover {
            background: var(--accent-hover);
        }
        /* ---- 数据库选择器（位于搜索框左侧） ---- */
        .toolbar .key-db-selector {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0 8px;
            height: 31px;
            transition: border 0.2s;
        }
        .toolbar .key-db-selector:focus-within {
            border-color: var(--accent);
        }
        .toolbar .key-db-selector > i {
            color: var(--text-muted);
            font-size: 13px;
            display: none; /* 小屏隐藏图标，紧凑显示 */
        }
        .toolbar .key-db-selector select {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
        }
        .toolbar .key-db-selector select:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            opacity: .6;
        }

        /* ---- 数据浏览区 ---- */
        .data-panel {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .key-tree {
            width: var(--tree-width);
            min-width: var(--tree-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 6px 0;
            flex-shrink: 0;
        }
        .key-tree::-webkit-scrollbar {
            width: 4px;
        }
        .key-tree::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .tree-node {
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }
        .tree-node .node-label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px 4px 8px;
            font-size: 13px;
            border-radius: 4px;
            margin: 1px 6px;
            transition: all 0.1s;
            position: relative;
        }
        .tree-node .node-label:hover {
            background: var(--bg-hover);
        }
        .tree-node .node-label .toggle {
            width: 18px;
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .tree-node .node-label .toggle.open {
            transform: rotate(90deg);
        }
        .tree-node .node-label .icon-folder {
            color: var(--yellow);
            font-size: 14px;
        }
        .tree-node .node-label .icon-key {
            color: var(--blue);
            font-size: 12px;
        }
        .tree-node .node-label .key-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 400;
        }
        .tree-node .node-label .key-type {
            font-size: 10px;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 0 6px;
            border-radius: 3px;
            flex-shrink: 0;
            font-weight: 500;
            text-transform: uppercase;
        }
        .tree-node .node-label .key-type.string { color: var(--green); }
        .tree-node .node-label .key-type.hash { color: var(--yellow); }
        .tree-node .node-label .key-type.list { color: var(--blue); }
        .tree-node .node-label .key-type.set { color: var(--purple); }
        .tree-node .node-label .key-type.zset { color: #e8a94a; }
        .tree-node .node-label .key-size {
            font-size: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .tree-node .node-label.active {
            background: var(--bg-active);
            border-left: 3px solid var(--accent);
            margin-left: 3px;
        }
        .tree-node .children {
            padding-left: 16px;
            overflow: hidden;
        }
        .tree-node .children.collapsed {
            display: none;
        }

        /* 右侧 Key 详情 */
        .key-detail {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
        }
        .key-detail::-webkit-scrollbar {
            width: 4px;
        }
        .key-detail::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .detail-header .key-title {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .detail-header .key-title .type-badge {
            font-size: 12px;
            font-weight: 500;
            padding: 2px 14px;
            border-radius: 12px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        .detail-header .key-title .type-badge.string { color: var(--green); background: rgba(124, 184, 75, 0.15); }
        .detail-header .key-title .type-badge.hash { color: var(--yellow); background: rgba(245, 179, 66, 0.15); }
        .detail-header .key-title .type-badge.list { color: var(--blue); background: rgba(106, 159, 216, 0.15); }
        .detail-header .key-title .type-badge.set { color: var(--purple); background: rgba(179, 146, 208, 0.15); }
        .detail-header .key-title .type-badge.zset { color: #e8a94a; background: rgba(232, 169, 74, 0.15); }
        .detail-header .ttl {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 4px 14px;
            border-radius: 12px;
        }
        .detail-header .ttl i {
            margin-right: 4px;
        }
        .detail-header .ttl input {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            padding: 2px 8px;
            font-size: 13px;
            width: 80px;
            outline: none;
        }
        .detail-header .ttl input:focus {
            border-color: var(--accent);
        }
        .detail-header .ttl input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .detail-header .detail-actions {
            margin-left: auto;
            display: flex;
            gap: 6px;
        }
        .detail-header .detail-actions button {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }
        .detail-header .detail-actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .detail-header .detail-actions button.danger:hover {
            background: rgba(245, 179, 66, 0.2);
            color: var(--accent);
        }
        .detail-header .detail-actions button.primary {
            background: var(--accent);
            color: #1a150e;
        }
        .detail-header .detail-actions button.primary:hover {
            background: var(--accent-hover);
        }
        .detail-header .detail-actions button:disabled,
        .detail-header .detail-actions button:disabled:hover {
            cursor: not-allowed;
        }

        .detail-body {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .detail-body .value-editor {
            padding: 16px 20px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .detail-body .value-editor textarea {
            width: 100%;
            flex: 1;
            min-height: 120px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 12px;
            font-size: 14px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            resize: vertical;
            outline: none;
            transition: border 0.2s;
            display: block;
        }
        .detail-body .value-editor textarea:focus {
            border-color: var(--accent);
        }
        .detail-body .value-editor .editor-toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }
        .detail-body .value-editor .editor-toolbar button {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }
        .detail-body .value-editor .editor-toolbar button:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }
        .detail-body .value-editor .hash-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .detail-body .value-editor .hash-view .field {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-input);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 13px;
        }
        .detail-body .value-editor .hash-view .field .fkey {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .detail-body .value-editor .hash-view .field .fval {
            color: var(--text-primary);
        }
        .detail-body .value-editor .list-view {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .detail-body .value-editor .list-view .item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-input);
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 13px;
        }
        .detail-body .value-editor .list-view .item .idx {
            color: var(--text-muted);
            font-size: 11px;
            width: 28px;
            flex-shrink: 0;
        }
        .detail-body .value-editor .list-view .item .val {
            color: var(--text-primary);
        }
        .detail-body .value-footer {
            padding: 10px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .detail-body .value-footer .info {
            display: flex;
            gap: 16px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--text-muted);
            text-align: center;
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.4;
            color: var(--accent);
        }
        .empty-state .empty-state-icon {
            width: 56px;
            height: 56px;
            border-radius: 20%;
            margin-bottom: 16px;
            opacity: 0.9;
        }
        .empty-state h3 {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .empty-state p {
            font-size: 13px;
            max-width: 300px;
        }

        /* ========== 终端面板 ========== */
        .terminal-panel {
            height: var(--terminal-height);
            min-height: var(--terminal-height);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.25s ease;
            overflow: hidden;
        }
        .terminal-panel.collapsed {
            height: 36px;
            min-height: 36px;
        }
        .terminal-panel .terminal-header {
            height: 36px;
            min-height: 36px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            flex-shrink: 0;
        }
        .terminal-panel .terminal-header .term-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .terminal-panel .terminal-header .term-label i {
            color: var(--accent);
        }
        .terminal-panel .terminal-header .spacer {
            flex: 1;
        }
        .terminal-panel .terminal-header .term-actions {
            display: flex;
            gap: 4px;
        }
        .terminal-panel .terminal-header .term-actions button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.15s;
        }
        .terminal-panel .terminal-header .term-actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .terminal-panel .terminal-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
        }
        .terminal-panel .terminal-body::-webkit-scrollbar {
            width: 4px;
        }
        .terminal-panel .terminal-body::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        .terminal-panel .terminal-body .line {
            padding: 2px 0;
            display: flex;
            gap: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .terminal-panel .terminal-body .line .prompt {
            color: var(--accent);
            flex-shrink: 0;
            font-weight: 500;
        }
        .terminal-panel .terminal-body .line .cmd {
            color: var(--text-primary);
        }
        .terminal-panel .terminal-body .line .output {
            color: var(--text-secondary);
        }
        .terminal-panel .terminal-body .line .output.error {
            color: #e5734b;
        }
        .terminal-panel .terminal-body .line .output.ok {
            color: var(--green);
        }
        .terminal-panel .terminal-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 16px 8px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .terminal-panel .terminal-input-row .prompt-label {
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .terminal-panel .terminal-input-row input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            outline: none;
            padding: 4px 0;
        }
        .terminal-panel .terminal-input-row input::placeholder {
            color: var(--text-muted);
        }
        .terminal-panel .terminal-input-row button {
            background: var(--accent);
            border: none;
            color: #1a150e;
            padding: 4px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .terminal-panel .terminal-input-row button:hover {
            background: var(--accent-hover);
        }

        /* ========== 连接对话框 ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 30px 34px;
            width: 520px;
            max-width: 94vw;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .modal .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal .modal-title i {
            color: var(--accent);
        }
        .modal .modal-title .logo-mark {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 5px rgba(245, 179, 66, 0.25));
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .modal .form-group input[type="checkbox"] {
            width: 14px !important;
            height: 14px;
            padding: 0;
            margin: 0;
            border: none;
            flex: 0 0 auto;
        }
        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus {
            border-color: var(--accent);
        }
        .modal .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: nowrap;
        }
        .modal .form-row .form-group {
            flex: 1;
            min-width: 0;
        }
        .modal .form-row .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 14px;
            user-select: none;
        }
        .modal .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .modal .modal-actions .spacer {
            flex: 1;
        }
        .modal .modal-actions button {
            padding: 8px 24px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .modal .modal-actions button.secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        .modal .modal-actions button.secondary:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .modal .modal-actions button.primary {
            background: var(--accent);
            color: #1a150e;
        }
        .modal .modal-actions button.primary:hover {
            background: var(--accent-hover);
        }
        #testStatus {
            font-size: 13px;
            margin-left: 8px;
            align-self: center;
            min-height: 20px;
        }
        #testStatus.success {
            color: var(--green);
        }
        #testStatus.error {
            color: #e06c75;
        }

        /* ========== 响应式微调 ========== */
        @media (max-width: 1100px) {
            :root {
                --sidebar-width: 200px;
                --tree-width: 260px;
            }
            .app-window {
                max-width: 100vw;
                max-height: 100vh;
                border-radius: 0;
                height: 100vh;
            }
        }
        @media (max-width: 780px) {
            :root {
                --sidebar-width: 0px;
                --tree-width: 0px;
            }
            .sidebar { display: none; }
            .key-tree { display: none; }
            .data-panel { flex-direction: column; }
            .detail-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .detail-header .detail-actions {
                margin-left: 0;
                width: 100%;
                flex-wrap: wrap;
            }
            .titlebar .connection-status {
                display: none;
            }
        }

        .highlight {
            background: var(--accent-dim) !important;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Toast 提示（沿用金黄色的强调） */
        .toast-notification {
            border-left-color: var(--accent) !important;
        }
    </style>
</head>
<body>

    <!-- ===== 共享 Logo 标记（连接/主界面弹窗共用，跟随主题色） ===== -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
        <symbol id="md-logo-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="titlebar-logo-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="var(--accent-hover)" />
                    <stop offset="100%" stop-color="var(--accent)" />
                </linearGradient>
            </defs>
            <ellipse cx="44" cy="26" rx="24" ry="9" fill="url(#titlebar-logo-gradient)" />
            <path d="M20 26 L20 70 Q20 78 44 78 Q68 78 68 70 L68 26" fill="url(#titlebar-logo-gradient)" />
            <path d="M20 42 Q44 50 68 42" stroke="rgba(255,255,255,0.35)" stroke-width="3" fill="none" stroke-linecap="round" />
            <path d="M20 60 Q44 68 68 60" stroke="rgba(255,255,255,0.35)" stroke-width="3" fill="none" stroke-linecap="round" />
            <circle cx="72" cy="72" r="18" fill="var(--bg-secondary)" stroke="var(--accent)" stroke-width="3" />
            <text x="72" y="77" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" font-size="13" fill="var(--accent)">MR</text>
            <circle cx="86" cy="56" r="5" fill="var(--accent)" />
            <circle cx="56" cy="86" r="5" fill="var(--accent)" />
            <path d="M68 56 L78 60" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" fill="none" />
            <path d="M64 68 L58 86" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" fill="none" />
        </symbol>
    </svg>

    <!-- ===== 主窗口 ===== -->
    <div class="app-window">

        <!-- ===== 标题栏 ===== -->
        <header class="titlebar">
            <div class="logo">
                <svg class="logo-mark" aria-label="麦地缓存 Logo"><use href="#md-logo-mark" /></svg>
                麦地缓存
                <span>v2.0</span>
            </div>
            <div class="connection-status">
                <span class="dot" id="statusDot"></span>
                <span id="statusLabel">已连接 · localhost:6379</span>
            </div>
            <div class="spacer"></div>
            <div class="theme-dropdown">
                <button title="切换主题" id="btnTheme" class="ghost-btn"><i class="fas fa-palette"></i></button>
                <div class="theme-menu" id="themeMenu">
                    <div class="theme-menu-title">选择主题</div>
                    <div class="theme-option active" data-theme-value="spring"><span class="theme-swatch" style="background:#4caf50"></span>春分</div>
                    <div class="theme-option" data-theme-value="summer"><span class="theme-swatch" style="background:#22a6f2"></span>立夏</div>
                    <div class="theme-option" data-theme-value="golden"><span class="theme-swatch" style="background:#d99a1b"></span>初秋</div>
                    <div class="theme-option" data-theme-value="autumn"><span class="theme-swatch" style="background:#f5b342"></span>深秋</div>
                    <div class="theme-option" data-theme-value="winter"><span class="theme-swatch" style="background:#f5f6fa"></span>冬至</div>
                </div>
            </div>
            <div class="actions">
                <button title="刷新所有Key" id="btnRefresh"><i class="fas fa-sync-alt"></i></button>
                <button title="清空当前数据库" id="btnFlush"><i class="fas fa-trash-alt"></i></button>
                <button class="primary" id="btnNewConnection"><i class="fas fa-plus"></i> 新建连接</button>
            </div>
        </header>

        <!-- ===== 主体 ===== -->
        <div class="app-body">

            <!-- ===== 左侧边栏 ===== -->
            <aside class="sidebar">
                <div class="section-title"><i class="fas fa-plug" style="margin-right:6px;"></i> 连接</div>
                <div class="connection-list" id="connectionList">
                    <!-- 由 JS 动态渲染 -->
                </div>
                <button class="add-connection" id="addConnectionBtn">
                    <i class="fas fa-plus-circle"></i> 添加连接
                </button>

                <div class="sidebar-footer">
                    <div class="server-stats">
                        <div class="stat-item" id="statDiskItem" title="Redis 持久化数据所在磁盘"><span>磁盘</span><span class="val" id="statDisk">-</span></div>
                        <div class="stat-item"><span>内存</span><span class="val" id="statMem">-</span></div>
                        <div class="stat-item"><span>连接数</span><span class="val" id="statConn">-</span></div>

            <!-- ===== 主内容 ===== -->
            <main class="main-content">

                <div class="toolbar">

                    <button id="termToggleBtn" title="折叠/展开"><i class="fas fa-chevron-down" id="termChevron"></i></button>

    <!-- 通用确认对话框（替代原生 confirm，避免 WebView 兼容问题） -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal" style="width: 400px;">
            <div class="modal-title"><i class="fas fa-exclamation-triangle" style="color: var(--accent);"></i> <span id="confirmTitle">提示</span></div>
            <div id="confirmMessage" style="margin-bottom: 24px; line-height: 1.6; color: var(--text-secondary); word-break: break-all;"></div>
            <div class="modal-actions" style="justify-content: flex-end; gap: 10px;">
                <button class="secondary" id="confirmCancel">取消</button>
                <button class="primary" id="confirmOk" style="background: var(--danger, #e5484d); border-color: var(--danger, #e5484d);">删除</button>
