[package]
name = "maidi-cache"
version = "0.1.0"
description = "麦地缓存 - Redis 管理客户端"
authors = ["maidi"]
edition = "2021"

[lib]
name = "maidi_cache_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "maidi-cache"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# ===== Redis =====
redis = { version = "0.25", features = ["tokio-comp", "connection-manager", "cluster", "cluster-async"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
