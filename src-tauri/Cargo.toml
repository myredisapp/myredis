[package]
name = "maidi-cache"
version = "0.1.0"
description = "麦地缓存 - Redis 管理客户端"
authors = ["maidi"]
edition = "2021"

[lib]
name = "maidi_cache_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "maidi-cache"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
percent-encoding = "2"
# ===== Redis =====
redis = { version = "0.25", features = ["tokio-comp", "connection-manager", "cluster", "cluster-async", "tokio-rustls-comp", "tls-rustls-insecure"] }
# sync：MONITOR 会话的停止信号（tokio::sync::Notify）
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
# MONITOR 的流式读取：redis-rs 的 on_message 返回 impl Stream，取下一行要 StreamExt
futures-util = "0.3"
# ===== 系统密钥链（密码不再明文落盘，见 DEVELOPMENT.md §2.4） =====
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
# ===== 系统信息 =====
sysinfo = "0.39"
# ===== 自动更新 =====
# 更新包由 CI 用 minisign 私钥签名，客户端用 tauri.conf.json 里的 pubkey 校验通过后才安装
tauri-plugin-updater = "2"
