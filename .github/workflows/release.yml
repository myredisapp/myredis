name: Release

# 打 tag 即触发（例如 git tag v0.2.0 && git push origin v0.2.0）。
# 流程：质量门禁（fmt/clippy/全量测试）与部署凭据校验并行 → 三平台构建 → 发 Release → 推网站。
# 产物：macOS(universal) dmg、Linux deb/AppImage、Windows nsis/msi，并发布到 GitHub Release。
# 安装包一律命名为 myredis-<tag>-<platform>.<ext>，见 .github/scripts/rename-artifacts.mjs
# 构建前先用 check-deploy-env 快速校验部署凭据 / SSH 连通 / scp 试传（fail-fast），
# 发布 Release 后先把当前 tag 注入 web/index.html（页面展示版本号 + 推导直链下载地址），再通过 scp 推到服务器。
on:
  push:
    tags:
      - 'v*'

# 创建 Release 并上传安装包需要写权限
permissions:
  contents: write

# 同一个 tag 重复触发时，取消上一次未跑完的运行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 质量门禁：与 ci.yml 同一个 composite action（fmt / clippy / 含 #[ignore] 的全量测试，
  # 测试环境由 action 内部拉起单机 + 三节点集群）。放在构建矩阵之前，代码有问题就别
  # 浪费三平台几十分钟的编译时间。日常推分支由 ci.yml 提前拦截，这里是发版前的兜底。
  # 这里只跑发行版基线（6.0）那一档：发版门禁求「最保守的环境也全绿」，
  # 完整版本矩阵（6.0 + 7.x）在 ci.yml 的 quality job 里跑，见 DEVELOPMENT.md §2.4。
  quality:
    name: 质量门禁（fmt / clippy / 全量测试）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-quality
        with:
          redis-version: '6.0'

  # fail-fast 前置闸门：在多平台构建矩阵之前校验签名私钥与部署环境，让缺失/配错的
  # 凭据在几秒内失败，而不是等几十分钟构建跑完才暴露。与 quality 并行跑：
  # 一个拦代码问题，一个拦凭据问题，谁快谁先失败
  # 见 .github/scripts/check-signing-key.mjs 与 .github/scripts/check-deploy-env.sh
  check-deploy-env:
    name: 检查部署环境
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 校验私钥要真跑一次 `tauri signer sign`：私钥是加密存放的，密码对不对、
      # 与公钥是否配对，只有实际签一次才能确定
      - name: 安装 Tauri CLI
        shell: bash
        run: |
          sudo env "PATH=$PATH" npm install -g @tauri-apps/cli@2.11.3
          tauri --version

      # 第一步：私钥能用 + 与 tauri.conf.json 里的公钥配对 + 清单相关配置齐全。
      # 配错的后果是「安装包照样出，只是客户端永远收不到更新」，属于必须前置拦下的静默失败
      - name: 校验更新签名私钥
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node .github/scripts/check-signing-key.mjs

      - name: 安装 SSH 工具
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client sshpass

      - name: 校验环境变量、SSH 连接与 SCP 上传
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          WEB_DEPLOY_PATH: ${{ vars.WEB_DEPLOY_PATH }}
          # 构建 job 用它给更新包签名；深度校验（密码 + 与公钥配对）在上一道步骤里
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash .github/scripts/check-deploy-env.sh

  build:
    name: 构建 ${{ matrix.label }}
    needs: [quality, check-deploy-env]
    runs-on: ${{ matrix.os }}
    strategy:
      # 单个平台失败不影响其他平台出包，便于定位问题
      fail-fast: false
      matrix:
        include:
          # 出单个 universal 包：用户不用先分辨自己是 Apple Silicon 还是 Intel。
          # 代价是 arm64/x64 各编译一遍（见 rust-targets），tauri 用 lipo 合成。
          - os: macos-latest
            label: macos-universal
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          # 刻意不用 ubuntu-latest（24.04）：Linux 产物会继承构建机的 glibc 版本，
          # 在 22.04 上打包才能兼容更老的发行版
          - os: ubuntu-22.04
            label: linux-x64
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            label: windows-x64
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v7

      # Tauri 在 Linux 上依赖 webkit2gtk / appindicator 等系统库
      - name: 安装 Linux 系统依赖
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf \
            file wget

      # node-version 与本地开发保持一致；node 20 已 EOL，且 24.x 的 npm 不再打印 punycode 弃用告警
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 走官方 npm 包拿预编译的 Tauri CLI，比 cargo install 现场编译快得多。
      # 版本与本地开发所用一致；升级 tauri crate 时这里一并调整。
      - name: 安装 Tauri CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # runner 用户对 /usr/local 没有写权限，而 sudo 会重置 PATH 丢掉 setup-node 装的 node，
            # 所以把 PATH 显式透传进去
            sudo env "PATH=$PATH" npm install -g @tauri-apps/cli@2.11.3
          else
            npm install -g @tauri-apps/cli@2.11.3
          fi
          tauri --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # 安装包版本号取自 tag，否则每次发版都会是仓库里写死的 0.1.0
      - name: 同步版本号（取自 tag）
        run: node .github/scripts/set-version.mjs "${{ github.ref_name }}"

      # 签名前再校验一次私钥（与 check-deploy-env 里同一脚本）：单独重跑构建 job 时
      # 前置闸门不会跑，而这一步产出的 .sig 出问题只会在用户侧表现为「收不到更新」
      - name: 校验更新签名私钥
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node .github/scripts/check-signing-key.mjs

      # macOS 代码签名与公证凭据（§2.4）。凭据齐全时写进 $GITHUB_ENV 供 tauri build 使用，
      # 缺一份就失败（半配的凭据会让产物「悄悄没签名」，见脚本注释）；一份都没有则告警放行
      - name: 配置 macOS 签名 / 公证凭据
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/setup-macos-signing.sh

      # bundles 的值必须加引号：Windows runner 的默认 shell 是 PowerShell，
      # 未加引号的 nsis,msi 会被它当成数组、展开成一个参数 "nsis msi" 传给 tauri，报 invalid value。
      #
      # 签名私钥只在 CI 里（仓库 secret），客户端用 tauri.conf.json 里的公钥校验，
      # 所以这一步产出的 .sig 必须跟着安装包一起发布，否则更新会被客户端拒掉。
      # 密码来自 secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD（换密钥/换密码见
      # scripts/rotate-signing-key.sh）。tauri 要求这个变量**存在**：空值按无密码处理，
      # 变量缺失则会去交互式索要密码，在 CI 里卡住。
      # macOS 上凭据齐全时，tauri 顺带完成导入证书 → 签名 → 公证 → staple（无需额外步骤）。
      - name: 构建并打包（含更新包签名）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --target ${{ matrix.target }} --bundles "${{ matrix.bundles }}"

      # 配了凭据就必须真的签上 / 公证到：tauri 在没有凭据时是「静默不签名」，
      # 那种失败只会在用户侧表现为「首次打开被 Gatekeeper 拦」，这里把它变成构建期失败
      - name: 校验 macOS 签名与公证
        if: runner.os == 'macOS'
        shell: bash
        run: bash .github/scripts/verify-macos-signing.sh "src-tauri/target/${{ matrix.target }}/release/bundle"

      # tauri 按 productName 命名安装包（macOS / Windows 是中文「麦地缓存」，Linux 是 maidi-cache），
      # 发布出来既不统一也不好认，上传前统一改成 myredis-<tag>-<platform>.<ext>。
      # bundles 传进去是让脚本只认本平台该有的产物，不去动别的扩展名。
      # 这一行刻意不换行、并显式指定 bash：Windows runner 默认 shell 是 PowerShell，续行符和引号规则都不同
      - name: 规范化安装包文件名
        shell: bash
        run: node .github/scripts/rename-artifacts.mjs "src-tauri/target/${{ matrix.target }}/release/bundle" "${{ github.ref_name }}" "${{ matrix.label }}" "${{ matrix.bundles }}"

      # 只收最终安装包：bundle/ 下还有 .app 目录、deb 解包目录等中间产物，整体上传会夹带大量无用文件。
      # 改名步骤把安装包统一成 myredis-<tag>-<platform>.<ext>，所以这里按新名收，
      # 改名没生效时下面的 if-no-files-found 会直接把流水线拦下来
      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          if-no-files-found: error
          retention-days: 7
          path: src-tauri/target/${{ matrix.target }}/release/bundle/*/myredis-*

  # 三个平台全部构建成功后，统一建 Release；分头创建会互相抢同一个 tag
  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # v0.2.0-beta.1 这类 tag 自动标记为预发布
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac

          find dist -type f -print
          ASSETS=()
          while IFS= read -r -d '' ASSET; do
            ASSETS+=("$ASSET")
          done < <(find dist -type f -print0)
          if ((${#ASSETS[@]} == 0)); then
            echo "未找到可上传的安装包" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # 流水线重跑时覆盖已有 Release 里的安装包
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              $PRERELEASE
          fi

      # 更新清单最后生成：它要引用刚上传的安装包名，notes 又取自刚生成的 Release 正文。
      # 地址固定为 releases/latest/download/latest.json（见 tauri.conf.json 的 endpoints），
      # 所以它必须挂在「最新一个正式 Release」上 —— 预发布不会顶掉 latest，符合预期。
      - name: 生成并上传更新清单 latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          # Release 正文就是 --generate-notes 的结果，直接拿来当更新说明
          gh release view "$TAG" --json body -q .body > release-notes.md
          node .github/scripts/gen-latest-json.mjs "$TAG" dist release-notes.md latest.json
          gh release upload "$TAG" latest.json --clobber

      # 上传成功不等于客户端取得到：按客户端真正使用的两个地址匿名回读一次并逐字节比对，
      # 免得「清单没挂上 / 挂错名字 / 内容与本地不一致」这类问题等到用户点「检查更新」才发现。
      - name: 回读校验更新清单
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          cat latest.json

          TAG_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/latest.json"
          if ! curl -fsSL "$TAG_URL" -o fetched-by-tag.json; then
            echo "::error::$TAG_URL 取不到：本次 Release 里没有 latest.json 附件（生成/上传步骤没生效）" >&2
            exit 1
          fi
          diff -u latest.json fetched-by-tag.json
          echo "✓ $TAG_URL 可匿名取到，内容与本地一致"

          case "$TAG" in
            *-*)
              echo "预发布不占用 latest 别名（不会顶掉正式版），跳过 latest 地址校验"
              exit 0
              ;;
          esac

          LATEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          # Release 刚建好时 latest 指向可能有几秒延迟，重试若干次
          for attempt in $(seq 1 10); do
            if curl -fsSL "$LATEST_URL" -o fetched-by-latest.json \
              && diff -q latest.json fetched-by-latest.json >/dev/null; then
              echo "✓ $LATEST_URL 已指向本次发布（tauri.conf.json 里的 endpoints 就是这个地址）"
              exit 0
            fi
            echo "第 ${attempt} 次校验 $LATEST_URL 未就绪，3 秒后重试"
            sleep 3
          done
          echo "::error::$LATEST_URL 未指向本次发布，客户端点「检查更新」会拿不到清单" >&2
          exit 1

  # Release 建好后把官网静态页推到服务器。web/ 下都是自包含单文件
  # （图标等资源全部内联），首页与 docs/ 子目录一并上传即可。
  deploy-web:
    name: 发布网站静态页面
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: 安装 SSH 工具
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client sshpass

      # web/index.html 里的版本号与下载直链来自占位符，发布前统一替换成当前 tag，
      # 保证页面上展示的版本与本次 Release 产物严格一致（本地预览时页面会回退查询 GitHub API）
      - name: 注入版本号（tag → 页面展示与直链下载地址）
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          # 与 rename-artifacts.mjs 的校验一致：tag 只含这些字符才能安全用作文件名、URL 与 sed 替换值
          if ! [[ "$TAG" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::tag \"$TAG\" 含非法字符，无法注入 web/index.html"
            exit 1
          fi
          if ! grep -q '__RELEASE_TAG__' web/index.html; then
            echo "::error::web/index.html 中找不到 __RELEASE_TAG__ 占位符，请检查页面模板"
            exit 1
          fi
          sed -i "s/__RELEASE_TAG__/${TAG}/g" web/index.html
          if grep -q '__RELEASE_TAG__' web/index.html; then
            echo "::error::__RELEASE_TAG__ 替换不彻底，请检查页面模板"
            exit 1
          fi
          echo "已把版本号 ${TAG} 注入 web/index.html"

      - name: 上传 web/ 静态页到服务器
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          WEB_DEPLOY_PATH: ${{ vars.WEB_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?请配置 secret: SSH_HOST（服务器 IP 或域名）}"
          : "${SSH_USERNAME:?请配置 secret: SSH_USERNAME（SSH 登录用户名）}"

          PORT="${SSH_PORT:-22}"
          TARGET_DIR="${WEB_DEPLOY_PATH:?请配置变量: WEB_DEPLOY_PATH（部署目标目录，例如 /var/www/myredis）}"

          # 端口用 -o 传（不要用 -p）：小写 -p 在 scp 里是"保留时间戳"，
          # 不是"端口"——会把端口号当成源文件吞掉。
          SSH_OPTS=(-o "Port=$PORT" -o StrictHostKeyChecking=accept-new)

          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            KEY_FILE="$(mktemp)"
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            SSH_OPTS+=(-i "$KEY_FILE" -o IdentitiesOnly=yes)
          elif [ -n "${SSH_PASSWORD:-}" ]; then
            export SSHPASS="$SSH_PASSWORD"
          else
            echo "::error::缺少认证凭据：请配置 SSH_PRIVATE_KEY 或 SSH_PASSWORD"
            exit 1
          fi

          # 私钥场景走 ssh/scp，密码场景前面挂 sshpass，其余参数完全一致
          run_ssh() {
            if [ -n "${SSH_PASSWORD:-}" ]; then
              sshpass -e ssh "${SSH_OPTS[@]}" "$SSH_USERNAME@$SSH_HOST" "$@"
            else
              ssh "${SSH_OPTS[@]}" "$SSH_USERNAME@$SSH_HOST" "$@"
            fi
          }
          run_scp() {
            if [ -n "${SSH_PASSWORD:-}" ]; then
              sshpass -e scp "${SSH_OPTS[@]}" "$1" "$SSH_USERNAME@$SSH_HOST:$2"
            else
              scp "${SSH_OPTS[@]}" "$1" "$SSH_USERNAME@$SSH_HOST:$2"
            fi
          }

          # docs 子目录里必须有 index.html，否则访问 /docs/ 会被 nginx 以目录列表或 403 拦掉
          run_ssh "mkdir -p '$TARGET_DIR' '$TARGET_DIR/docs'"

          # 首页导航的「文档」指向 docs/，两个文件必须同批部署，避免入口指向不存在的页面
          run_scp web/index.html      "$TARGET_DIR/index.html"
          run_scp web/docs/index.html "$TARGET_DIR/docs/index.html"

          echo "已部署到 $SSH_USERNAME@$SSH_HOST:$TARGET_DIR/{index.html,docs/index.html}"
