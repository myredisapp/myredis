name: CI

# 每次推分支、开 / 更新 PR 都跑质量门禁，把 fmt / clippy / 测试问题拦在
# 打 tag 之前。发版时的全量门禁在 release.yml 的 quality job 里（同一 composite action）。
on:
  push:
    branches:
      - '**'
    # tag 推送由 release.yml 处理，其 quality job 会跑同样的门禁，不重复触发
    tags-ignore:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: 质量门禁（Redis ${{ matrix.redis }}）
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个版本红不影响另一个的结论，便于定位「只有某个版本挂」的问题
      fail-fast: false
      matrix:
        include:
          # 兼容性基线：本项目目标支持 Redis 2.8+，发行版自带的 6.0 是最低一档真机环境，
          # COPY / CLIENT SETINFO / MONITOR 这些版本相关的分支主要靠它兜住
          - os: ubuntu-22.04
            redis: '6.0'
          # 现代版本：Ubuntu 24.04 自带 7.0，保证新版 Redis 上集成用例同样全绿
          - os: ubuntu-24.04
            redis: '7.'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-quality
        with:
          redis-version: ${{ matrix.redis }}

  frontend-smoke:
    # 前端是「无构建步骤」的原生 ES 模块，没有编译器兜底，所以用 headless Chrome 跑一遍
    # 真实点击路径（连接 / 分页 / 搜索 / 集合编辑 / 重命名复制 / 终端 / 监控 / 导入导出 /
    # 更新），断言 DOM 结果并检查没有 JS 报错。
    # 需要 Node 22+（内置 WebSocket 说 CDP）与镜像自带的 Chrome；不需要 Rust 与 Redis。
    name: 前端冒烟（headless Chrome）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 前端冒烟脚本（scripts/frontend-smoke.mjs）
        run: node scripts/frontend-smoke.mjs

      - name: 失败时留档截图与断言结果
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-smoke
          path: target/frontend-smoke/
          retention-days: 7
